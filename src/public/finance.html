<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Finance — NEXUM</title>
<link rel="stylesheet" href="/shared/design-system.css">
<style>
  .amount-positive { color: var(--green); }
  .amount-negative { color: var(--red); }
  .balance-card {
    background: linear-gradient(135deg, #1a1d27 0%, #252838 100%);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 16px;
    position: relative; overflow: hidden;
  }
  .balance-card::before {
    content: ''; position: absolute; top: -40px; right: -40px;
    width: 120px; height: 120px;
    background: var(--accent-dim); border-radius: 50%;
  }
  .balance-label { font-size: .8rem; color: var(--text3); text-transform: uppercase; letter-spacing: .06em; }
  .balance-amount { font-size: 2.4rem; font-weight: 800; margin: 8px 0 4px; letter-spacing: -.03em; }
  .balance-sub { font-size: .85rem; color: var(--text2); }
  .txn-type-btn {
    flex: 1; padding: 10px; border-radius: var(--radius-sm);
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text2); font-size: .9rem; font-weight: 600; cursor: pointer;
    transition: all .15s;
  }
  .txn-type-btn.active-income  { background: var(--green-dim); color: var(--green); border-color: rgba(34,211,165,.4); }
  .txn-type-btn.active-expense { background: var(--red-dim);   color: var(--red);   border-color: rgba(255,90,126,.4); }
  .filter-tabs { display: flex; gap: 6px; margin-bottom: 12px; overflow-x: auto; padding-bottom: 2px; }
  .filter-tab {
    padding: 6px 14px; border-radius: 99px; white-space: nowrap;
    border: 1px solid var(--border); background: var(--surface);
    color: var(--text2); font-size: .8rem; font-weight: 500; cursor: pointer;
  }
  .filter-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-logo">
    <div class="logo-dot">💰</div>
    <h1>Finance</h1>
  </div>
  <button class="btn btn-ghost btn-icon" onclick="openModal()" title="Add">+</button>
</header>

<div class="page">
  <!-- Balance Card -->
  <div class="balance-card">
    <div class="balance-label">Total Balance</div>
    <div class="balance-amount" id="balanceAmt">$0.00</div>
    <div class="balance-sub" id="balanceSub">Loading...</div>
  </div>

  <!-- Stats -->
  <div class="stat-grid">
    <div class="stat-card">
      <div class="stat-label">Income</div>
      <div class="stat-value amount-positive" id="totalIncome">$0</div>
      <div class="stat-sub">this month</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Expenses</div>
      <div class="stat-value amount-negative" id="totalExpense">$0</div>
      <div class="stat-sub">this month</div>
    </div>
  </div>

  <!-- Filter -->
  <div class="filter-tabs">
    <button class="filter-tab active" onclick="setFilter('all',this)">All</button>
    <button class="filter-tab" onclick="setFilter('income',this)">Income</button>
    <button class="filter-tab" onclick="setFilter('expense',this)">Expenses</button>
    <button class="filter-tab" onclick="setFilter('food',this)">Food</button>
    <button class="filter-tab" onclick="setFilter('transport',this)">Transport</button>
    <button class="filter-tab" onclick="setFilter('salary',this)">Salary</button>
  </div>

  <!-- Transactions List -->
  <div id="txnList"></div>
</div>

<!-- FAB -->
<button class="fab" onclick="openModal()">+</button>

<!-- Add Transaction Modal -->
<div class="modal-overlay" id="modal" onclick="closeIfBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>Add Transaction</h2>
    <div style="display:flex;gap:8px;margin-bottom:16px">
      <button class="txn-type-btn active-income" id="btnIncome"  onclick="setType('income')">+ Income</button>
      <button class="txn-type-btn"               id="btnExpense" onclick="setType('expense')">- Expense</button>
    </div>
    <div class="form-group">
      <label class="form-label">Amount</label>
      <input class="input" id="inAmount" type="number" placeholder="0.00" min="0" step="0.01">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Category</label>
        <select class="input" id="inCategory">
          <option value="salary">Salary</option>
          <option value="freelance">Freelance</option>
          <option value="food">Food</option>
          <option value="transport">Transport</option>
          <option value="shopping">Shopping</option>
          <option value="utilities">Utilities</option>
          <option value="health">Health</option>
          <option value="entertainment">Entertainment</option>
          <option value="other">Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Currency</label>
        <select class="input" id="inCurrency">
          <option value="USD">USD</option>
          <option value="EUR">EUR</option>
          <option value="RUB">RUB</option>
          <option value="UZS">UZS</option>
        </select>
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Note (optional)</label>
      <input class="input" id="inNote" type="text" placeholder="What was this for?">
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="addTxn()">Save</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const uid = new URLSearchParams(location.search).get('uid') || 0;
const API = '/api';
let filter = 'all';
let txnType = 'income';

const CAT_ICONS = {
  salary:'💼', freelance:'💻', food:'🍔', transport:'🚗',
  shopping:'🛍', utilities:'💡', health:'❤️', entertainment:'🎮', other:'📦',
  income:'📈', expense:'📉'
};

async function load() {
  try {
    const [txns, summary] = await Promise.all([
      fetch(`${API}/finance?uid=${uid}`).then(r=>r.json()),
      fetch(`${API}/finance/summary?uid=${uid}`).then(r=>r.json()).catch(()=>null),
    ]);

    // Compute balance
    let income = 0, expense = 0;
    txns.forEach(t => {
      if (t.type === 'income') income += +t.amount;
      else expense += +t.amount;
    });
    const balance = income - expense;

    document.getElementById('balanceAmt').textContent = fmt(balance);
    document.getElementById('balanceAmt').className = 'balance-amount ' + (balance >= 0 ? 'amount-positive' : 'amount-negative');
    document.getElementById('balanceSub').textContent = `${txns.length} transactions`;
    document.getElementById('totalIncome').textContent = fmt(income);
    document.getElementById('totalExpense').textContent = fmt(expense);

    renderList(txns);
  } catch(e) {
    document.getElementById('txnList').innerHTML = `<div class="empty"><div class="empty-icon">❌</div><h3>Load failed</h3><p>${e.message}</p></div>`;
  }
}

function renderList(txns) {
  const filtered = filter === 'all' ? txns
    : txns.filter(t => t.type === filter || t.category === filter);

  const el = document.getElementById('txnList');
  if (!filtered.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">💸</div><h3>No transactions</h3><p>Add your first transaction</p></div>`;
    return;
  }
  el.innerHTML = filtered.map(t => `
    <div class="list-item fade-in">
      <div class="list-item-icon" style="background:var(--${t.type==='income'?'green':'red'}-dim)">
        ${CAT_ICONS[t.category] || '💰'}
      </div>
      <div class="list-item-body">
        <div class="list-item-title">${t.category || t.type}</div>
        <div class="list-item-sub">${t.note || ''} · ${fmtDate(t.created_at)}</div>
      </div>
      <div class="list-item-right">
        <div class="${t.type==='income'?'amount-positive':'amount-negative'}" style="font-weight:700">
          ${t.type==='income'?'+':'-'}${fmt(t.amount, t.currency)}
        </div>
      </div>
    </div>`).join('');
}

function fmt(n, currency='USD') {
  return new Intl.NumberFormat('en-US',{style:'currency',currency,maximumFractionDigits:0}).format(n||0);
}
function fmtDate(s) {
  if (!s) return '';
  const d = new Date(s);
  return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
}
function setFilter(f, el) {
  filter = f;
  document.querySelectorAll('.filter-tab').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');
  load();
}
function setType(t) {
  txnType = t;
  document.getElementById('btnIncome').className  = 'txn-type-btn' + (t==='income'  ? ' active-income'  : '');
  document.getElementById('btnExpense').className = 'txn-type-btn' + (t==='expense' ? ' active-expense' : '');
}
function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeIfBg(e) { if (e.target.id==='modal') closeModal(); }

async function addTxn() {
  const amount = parseFloat(document.getElementById('inAmount').value);
  if (!amount || amount <= 0) return showToast('Enter a valid amount');
  const body = {
    uid, type: txnType,
    amount,
    category: document.getElementById('inCategory').value,
    currency: document.getElementById('inCurrency').value,
    note: document.getElementById('inNote').value,
  };
  try {
    await fetch(`${API}/finance`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    closeModal();
    showToast('✅ Saved!');
    document.getElementById('inAmount').value='';
    document.getElementById('inNote').value='';
    load();
  } catch(e) { showToast('Error: '+e.message); }
}

function showToast(msg, ms=2500) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), ms);
}

load();
</script>
</body>
</html>
