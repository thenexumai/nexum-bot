<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Finance — NEXUM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--bg2:#0a0a0a;--bg3:#1c1c1e;--bg4:#2c2c2e;--bg5:#3a3a3c;
  --fg:#fff;--fg2:rgba(255,255,255,0.6);--fg3:rgba(255,255,255,0.3);--sep:rgba(255,255,255,0.08);
  --green:#30d158;--red:#ff453a;--blue:#0a84ff;--orange:#ff9f0a;
  --r:16px;--font:-apple-system,"SF Pro Display",system-ui,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{display:none}

.header{padding:16px 20px 0;display:flex;align-items:center;justify-content:space-between}
.back{width:32px;height:32px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--fg2)}
.back svg{width:18px;height:18px;fill:currentColor}
.title{font-size:17px;font-weight:600}
.add-btn{width:32px;height:32px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:#fff}
.add-btn svg{width:18px;height:18px;fill:currentColor}

/* Period selector */
.period-bar{display:flex;gap:6px;padding:16px 20px;overflow-x:auto;scrollbar-width:none}
.period-btn{padding:7px 14px;border-radius:20px;border:none;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;background:var(--bg3);color:var(--fg2);white-space:nowrap;transition:all 0.15s;flex-shrink:0}
.period-btn.act{background:var(--fg);color:var(--bg)}

/* Balance card */
.balance-card{margin:0 20px 20px;background:var(--bg3);border-radius:var(--r);padding:24px 20px;position:relative;overflow:hidden}
.balance-glow{position:absolute;top:-50px;right:-30px;width:160px;height:160px;border-radius:50%;background:var(--blue);opacity:0.07;filter:blur(40px);pointer-events:none}
.balance-label{font-size:13px;color:var(--fg2);margin-bottom:8px;font-weight:500}
.balance-amount{font-size:36px;font-weight:700;letter-spacing:-1.5px;margin-bottom:16px}
.balance-amount.pos{color:var(--green)}
.balance-amount.neg{color:var(--red)}
.balance-row{display:flex;gap:12px}
.balance-stat{flex:1;background:rgba(255,255,255,0.05);border-radius:10px;padding:12px}
.stat-label{font-size:11px;color:var(--fg2);margin-bottom:4px;font-weight:500}
.stat-amount{font-size:16px;font-weight:600;letter-spacing:-0.5px}
.stat-amount.inc{color:var(--green)}
.stat-amount.exp{color:var(--red)}

/* Section */
.sec{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg3);padding:0 20px 10px}
.list{margin:0 20px 24px;background:var(--bg3);border-radius:var(--r);overflow:hidden}
.tx-row{display:flex;align-items:center;padding:14px 16px;border-bottom:0.5px solid var(--sep);gap:12px}
.tx-row:last-child{border:none}
.tx-dot{width:36px;height:36px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-weight:700;font-size:13px}
.tx-dot.inc{background:rgba(48,209,88,.15);color:var(--green)}
.tx-dot.exp{background:rgba(255,69,58,.15);color:var(--red)}
.tx-body{flex:1;min-width:0}
.tx-cat{font-size:14px;font-weight:500;text-transform:capitalize}
.tx-note{font-size:12px;color:var(--fg2);margin-top:1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx-date{font-size:11px;color:var(--fg3);margin-top:1px}
.tx-amt{font-weight:600;font-size:15px;letter-spacing:-0.3px;flex-shrink:0}
.tx-amt.inc{color:var(--green)}
.tx-amt.exp{color:var(--red)}
.empty{padding:32px 20px;text-align:center;color:var(--fg2);font-size:14px}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:10;display:none;backdrop-filter:blur(4px)}
.sheet-bg.show{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:24px 24px 0 0;z-index:11;padding:12px 20px 40px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1)}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--bg5);border-radius:2px;margin:0 auto 20px}
.sheet-title{font-size:17px;font-weight:600;margin-bottom:20px;text-align:center}
.type-seg{display:flex;background:var(--bg3);border-radius:10px;padding:3px;margin-bottom:16px}
.seg-btn{flex:1;padding:8px;border-radius:7px;border:none;font-family:var(--font);font-size:14px;font-weight:500;cursor:pointer;background:transparent;color:var(--fg2);transition:all 0.15s}
.seg-btn.act{background:var(--bg4);color:var(--fg)}
.seg-btn.act.inc{background:rgba(48,209,88,.2);color:var(--green)}
.seg-btn.act.exp{background:rgba(255,69,58,.2);color:var(--red)}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--fg2);font-weight:500;margin-bottom:6px;letter-spacing:0.02em}
.field input,.field select{width:100%;background:var(--bg3);border:1.5px solid transparent;border-radius:10px;padding:13px 14px;color:var(--fg);font-family:var(--font);font-size:15px;outline:none;transition:border-color 0.15s;appearance:none;-webkit-appearance:none}
.field input:focus,.field select:focus{border-color:var(--blue)}
.field input::placeholder{color:var(--fg3)}
.save-btn{width:100%;padding:16px;background:var(--blue);border:none;border-radius:14px;color:#fff;font-family:var(--font);font-size:16px;font-weight:600;cursor:pointer;transition:opacity 0.15s;margin-top:4px}
.save-btn:active{opacity:0.8}
.pb{height:env(safe-area-inset-bottom,20px)}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.balance-card{animation:fadeUp 0.3s ease both}
.list{animation:fadeUp 0.3s ease 0.08s both}
</style>
</head>
<body>
<div class="header">
  <button class="back" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>
  <span class="title">Finance</span>
  <button class="add-btn" onclick="openSheet()">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>
</div>

<div class="period-bar">
  <button class="period-btn act" onclick="setPeriod('month',this)">Month</button>
  <button class="period-btn" onclick="setPeriod('week',this)">Week</button>
  <button class="period-btn" onclick="setPeriod('today',this)">Today</button>
  <button class="period-btn" onclick="setPeriod('year',this)">Year</button>
</div>

<div class="balance-card">
  <div class="balance-glow"></div>
  <div class="balance-label">Net Balance</div>
  <div class="balance-amount" id="net-balance">—</div>
  <div class="balance-row">
    <div class="balance-stat">
      <div class="stat-label">Income</div>
      <div class="stat-amount inc" id="total-income">—</div>
    </div>
    <div class="balance-stat">
      <div class="stat-label">Expenses</div>
      <div class="stat-amount exp" id="total-expense">—</div>
    </div>
  </div>
</div>

<div class="sec">TRANSACTIONS</div>
<div class="list" id="tx-list"><div class="empty">Loading...</div></div>
<div class="pb"></div>

<!-- Add Sheet -->
<div class="sheet-bg" id="sheet-bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">New Transaction</div>
  <div class="type-seg">
    <button class="seg-btn act exp" id="type-exp" onclick="setType('expense')">Expense</button>
    <button class="seg-btn" id="type-inc" onclick="setType('income')">Income</button>
  </div>
  <div class="field"><label>Amount</label><input type="number" id="f-amount" placeholder="0.00" inputmode="decimal"></div>
  <div class="field">
    <label>Category</label>
    <select id="f-cat">
      <option value="food">Food</option><option value="transport">Transport</option>
      <option value="shopping">Shopping</option><option value="health">Health</option>
      <option value="entertainment">Entertainment</option><option value="salary">Salary</option>
      <option value="freelance">Freelance</option><option value="other">Other</option>
    </select>
  </div>
  <div class="field"><label>Note (optional)</label><input type="text" id="f-note" placeholder="Description..."></div>
  <button class="save-btn" onclick="saveTx()">Save</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const BASE = window.location.origin;
const params = new URLSearchParams(window.location.search);
const initData = tg?.initData || params.get('initData') || '';
const uid = (() => {
  // Try Telegram initData first
  if (initData) {
    try {
      const p = new URLSearchParams(initData);
      const user = JSON.parse(p.get('user') || '{}');
      if (user.id) return user.id;
    } catch {}
    try {
      const m = initData.match(/user=([^&]+)/);
      if (m) return JSON.parse(decodeURIComponent(m[1])).id;
    } catch {}
  }
  return params.get('uid') || null;
})();

function apiBase() {
  const p = new URLSearchParams();
  if (initData) p.set('initData', initData);
  else if (uid) p.set('uid', String(uid));
  const q = p.toString();
  return (path) => BASE + path + (q ? '?' + q : '');
}
const api = apiBase();

let period = 'month';
let txType = 'expense';

function fmt(n) {
  return new Intl.NumberFormat('en-US', { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(n);
}
function fmtDate(d) {
  const date = new Date(d);
  return date.toLocaleDateString('en', { month: 'short', day: 'numeric' });
}

async function load() {
  try {
    const r = await fetch(api('/api/finance') + (api('/api/finance').includes('?') ? '&' : '?') + 'period=' + period);
    const d = await r.json();
    if (!d.ok) return;
    const txs = d.data;
    let inc = 0, exp = 0;
    txs.forEach(t => { if (t.type === 'income') inc += t.amount; else exp += t.amount; });
    const net = inc - exp;
    const nb = document.getElementById('net-balance');
    nb.textContent = fmt(net);
    nb.className = 'balance-amount ' + (net >= 0 ? 'pos' : 'neg');
    document.getElementById('total-income').textContent = fmt(inc);
    document.getElementById('total-expense').textContent = fmt(exp);
    const list = document.getElementById('tx-list');
    if (!txs.length) { list.innerHTML = '<div class="empty">No transactions yet</div>'; return; }
    list.innerHTML = txs.slice(0, 50).map(t => `
      <div class="tx-row">
        <div class="tx-dot ${t.type === 'income' ? 'inc' : 'exp'}">${t.category.slice(0,3).toUpperCase()}</div>
        <div class="tx-body">
          <div class="tx-cat">${t.category}</div>
          ${t.note ? `<div class="tx-note">${t.note}</div>` : ''}
          <div class="tx-date">${fmtDate(t.created_at)}</div>
        </div>
        <div class="tx-amt ${t.type === 'income' ? 'inc' : 'exp'}">${t.type === 'income' ? '+' : '-'}${fmt(t.amount)}</div>
      </div>
    `).join('');
  } catch(e) { document.getElementById('tx-list').innerHTML = '<div class="empty">Failed to load</div>'; }
}

function setPeriod(p, btn) {
  period = p;
  document.querySelectorAll('.period-btn').forEach(b => b.classList.remove('act'));
  btn.classList.add('act');
  load();
}

function openSheet() {
  document.getElementById('sheet-bg').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  setTimeout(() => document.getElementById('f-amount').focus(), 350);
  if (params.get('new')) { /* auto-open */ }
}
function closeSheet() {
  document.getElementById('sheet-bg').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
function setType(t) {
  txType = t;
  document.getElementById('type-exp').className = 'seg-btn' + (t==='expense'?' act exp':'');
  document.getElementById('type-inc').className = 'seg-btn' + (t==='income'?' act inc':'');
}
async function saveTx() {
  const amount = parseFloat(document.getElementById('f-amount').value);
  if (!amount || isNaN(amount)) { document.getElementById('f-amount').focus(); return; }
  const category = document.getElementById('f-cat').value;
  const note = document.getElementById('f-note').value;
  try {
    await fetch(BASE + '/api/finance', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ type: txType, amount, category, note, initData, uid }),
    });
    document.getElementById('f-amount').value = '';
    document.getElementById('f-note').value = '';
    closeSheet();
    load();
    if (tg) tg.HapticFeedback?.notificationOccurred('success');
  } catch { alert('Failed to save'); }
}

if (params.get('new')) setTimeout(openSheet, 400);
load();
</script>
</body>
</html>
