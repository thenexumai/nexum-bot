<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Contacts — NEXUM</title>
<link rel="stylesheet" href="/shared/design-system.css">
<style>
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.1rem; font-weight: 700; flex-shrink: 0;
  }
  .search-bar { margin-bottom: 10px; }
  .alpha-section { margin-bottom: 4px; }
  .alpha-label { font-size: .7rem; font-weight: 800; color: var(--text3); text-transform: uppercase; letter-spacing: .08em; padding: 8px 0 4px; }
  .contact-actions { display: flex; gap: 8px; margin-top: 12px; }
  .detail-row { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
  .detail-icon { width: 32px; text-align: center; font-size: 1rem; }
  .detail-val  { font-size: .9rem; }
  .detail-key  { font-size: .75rem; color: var(--text3); }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/><path d="M16 3.13a4 4 0 010 7.75"/></svg></div>
    <h1>Contacts</h1>
  </div>
  <span class="badge badge-accent" id="countBadge">0</span>
</header>

<div class="page">
  <div class="search-bar">
    <input class="input" id="searchInput" type="search" placeholder="Search contacts..." oninput="render()">
  </div>
  <div id="contactList"></div>
</div>

<button class="fab" onclick="openAdd()">
  <svg class="icon icon-lg" style="fill:none;stroke:#fff;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
</button>

<!-- Add/Edit Modal -->
<div class="modal-overlay" id="addModal" onclick="closeIfBg(event,'addModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2 id="addTitle">New Contact</h2>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">First Name</label>
        <input class="input" id="inFirst" type="text" placeholder="John">
      </div>
      <div class="form-group">
        <label class="form-label">Last Name</label>
        <input class="input" id="inLast" type="text" placeholder="Doe">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Phone</label>
      <input class="input" id="inPhone" type="tel" placeholder="+1 555 000 0000">
    </div>
    <div class="form-group">
      <label class="form-label">Email</label>
      <input class="input" id="inEmail" type="email" placeholder="john@example.com">
    </div>
    <div class="form-group">
      <label class="form-label">Company</label>
      <input class="input" id="inCompany" type="text" placeholder="Acme Inc.">
    </div>
    <div class="form-group">
      <label class="form-label">Notes</label>
      <textarea class="input" id="inNotes" placeholder="How you met, tags..."></textarea>
    </div>
    <div style="display:flex;gap:8px">
      <button class="btn btn-primary" style="flex:1" onclick="saveContact()">Save</button>
      <button class="btn btn-danger" id="deleteBtn" style="display:none" onclick="deleteContact()">Delete</button>
    </div>
  </div>
</div>

<!-- Detail Modal -->
<div class="modal-overlay" id="detailModal" onclick="closeIfBg(event,'detailModal')">
  <div class="modal">
    <div class="modal-handle"></div>
    <div style="text-align:center;margin-bottom:16px">
      <div class="avatar" id="detailAvatar" style="margin:0 auto 10px;width:64px;height:64px;font-size:1.6rem"></div>
      <h2 id="detailName"></h2>
      <div id="detailCompany" style="color:var(--text2);font-size:.85rem;margin-top:2px"></div>
    </div>
    <div id="detailRows"></div>
    <div class="contact-actions">
      <button class="btn btn-ghost" style="flex:1" onclick="editCurrent()">Edit</button>
      <button class="btn btn-primary" style="flex:1" id="callBtn">Call</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const uid = new URLSearchParams(location.search).get('uid') || 0;
const API = '/api';
let contacts = [];
let editId = null;
let currentContact = null;

const COLORS = ['#6c63ff','#22d3a5','#ff5a7e','#fbbf24','#38bdf8','#a78bfa','#fb923c'];
function avatarColor(name) { let h=0; for(const c of name) h=(h+c.charCodeAt(0))%COLORS.length; return COLORS[h]; }
function initials(c) { return ((c.first_name||'?')[0]+(c.last_name||'')[0]||'').toUpperCase(); }

async function load() {
  try {
    contacts = await fetch(`${API}/contacts?uid=${uid}`).then(r => r.json());
    render();
  } catch(e) {
    document.getElementById('contactList').innerHTML = `<div class="empty"><div class="empty-icon"><svg><use href="#ic-person"/></svg></div><h3>${e.message}</h3></div>`;
  }
}

function render() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  let list = q
    ? contacts.filter(c => `${c.first_name} ${c.last_name} ${c.company||''}`.toLowerCase().includes(q))
    : contacts;

  list = list.slice().sort((a,b) => (a.first_name||'').localeCompare(b.first_name||''));
  document.getElementById('countBadge').textContent = list.length;

  if (!list.length) {
    document.getElementById('contactList').innerHTML = `<div class="empty"><div class="empty-icon"><svg><use href="#ic-person"/></svg></div><h3>No contacts</h3><p>Add your first contact</p></div>`;
    return;
  }

  // Group by first letter
  const groups = {};
  list.forEach(c => {
    const letter = (c.first_name||'?')[0].toUpperCase();
    if (!groups[letter]) groups[letter] = [];
    groups[letter].push(c);
  });

  document.getElementById('contactList').innerHTML = Object.keys(groups).sort().map(letter => `
    <div class="alpha-section">
      <div class="alpha-label">${letter}</div>
      ${groups[letter].map(c => `
        <div class="list-item" onclick="openDetail(${c.id})" style="cursor:pointer">
          <div class="avatar" style="background:${avatarColor(c.first_name||'?')};color:#fff">${initials(c)}</div>
          <div class="list-item-body">
            <div class="list-item-title">${esc(c.first_name||'')} ${esc(c.last_name||'')}</div>
            <div class="list-item-sub">${c.company ? esc(c.company)+' · ' : ''}${c.phone||c.email||''}</div>
          </div>
        </div>`).join('')}
    </div>`).join('');
}

function openDetail(id) {
  currentContact = contacts.find(c => c.id === id);
  if (!currentContact) return;
  const c = currentContact;
  document.getElementById('detailAvatar').style.background = avatarColor(c.first_name||'?');
  document.getElementById('detailAvatar').style.color = '#fff';
  document.getElementById('detailAvatar').textContent = initials(c);
  document.getElementById('detailName').textContent = `${c.first_name||''} ${c.last_name||''}`.trim();
  document.getElementById('detailCompany').textContent = c.company || '';

  const rows = [
    c.phone   && `<div class="detail-row"><div class="detail-icon" style="color:var(--green)"><svg class="icon" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M22 16.92v3a2 2 0 01-2.18 2 19.79 19.79 0 01-8.63-3.07A19.5 19.5 0 013.07 8.81 19.79 19.79 0 01.03 1.18 2 2 0 012 0h3a2 2 0 012 1.72c.127.96.361 1.903.7 2.81a2 2 0 01-.45 2.11L6.09 7.91a16 16 0 006 6l1.27-1.27a2 2 0 012.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0122 16.92z"/></svg></div><div><div class="detail-val">${esc(c.phone)}</div><div class="detail-key">Phone</div></div></div>`,
    c.email   && `<div class="detail-row"><div class="detail-icon" style="color:var(--accent2)"><svg class="icon" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/></svg></div><div><div class="detail-val">${esc(c.email)}</div><div class="detail-key">Email</div></div></div>`,
    c.company && `<div class="detail-row"><div class="detail-icon" style="color:var(--blue)"><svg class="icon" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M6 22V4a2 2 0 012-2h8a2 2 0 012 2v18z"/><path d="M6 12H4a2 2 0 00-2 2v6a2 2 0 002 2h2"/><path d="M18 9h2a2 2 0 012 2v9a2 2 0 01-2 2h-2"/><line x1="10" y1="6" x2="10" y2="6"/><line x1="14" y1="6" x2="14" y2="6"/><line x1="10" y1="10" x2="10" y2="10"/><line x1="14" y1="10" x2="14" y2="10"/><line x1="10" y1="14" x2="10" y2="14"/><line x1="14" y1="14" x2="14" y2="14"/></svg></div><div><div class="detail-val">${esc(c.company)}</div><div class="detail-key">Company</div></div></div>`,
    c.notes   && `<div class="detail-row"><div class="detail-icon" style="color:var(--yellow)"><svg class="icon" style="fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></div><div><div class="detail-val">${esc(c.notes)}</div><div class="detail-key">Notes</div></div></div>`,
  ].filter(Boolean).join('');

  document.getElementById('detailRows').innerHTML = rows || '<p style="color:var(--text3);font-size:.85rem">No details</p>';
  if (c.phone) { document.getElementById('callBtn').onclick = () => window.open(`tel:${c.phone}`); }
  document.getElementById('detailModal').classList.add('open');
}

function editCurrent() {
  closeModal('detailModal');
  setTimeout(() => openEdit(currentContact), 200);
}

function openAdd() {
  editId = null;
  document.getElementById('addTitle').textContent = 'New Contact';
  document.getElementById('deleteBtn').style.display = 'none';
  ['inFirst','inLast','inPhone','inEmail','inCompany','inNotes'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('addModal').classList.add('open');
}

function openEdit(c) {
  editId = c.id;
  document.getElementById('addTitle').textContent = 'Edit Contact';
  document.getElementById('deleteBtn').style.display = 'flex';
  document.getElementById('inFirst').value    = c.first_name || '';
  document.getElementById('inLast').value     = c.last_name  || '';
  document.getElementById('inPhone').value    = c.phone      || '';
  document.getElementById('inEmail').value    = c.email      || '';
  document.getElementById('inCompany').value  = c.company    || '';
  document.getElementById('inNotes').value    = c.notes      || '';
  document.getElementById('addModal').classList.add('open');
}

async function saveContact() {
  const body = {
    uid,
    first_name: document.getElementById('inFirst').value.trim(),
    last_name:  document.getElementById('inLast').value.trim(),
    phone:      document.getElementById('inPhone').value.trim(),
    email:      document.getElementById('inEmail').value.trim(),
    company:    document.getElementById('inCompany').value.trim(),
    notes:      document.getElementById('inNotes').value.trim(),
  };
  if (!body.first_name) return showToast('First name required');

  if (editId) {
    await fetch(`${API}/contacts/${editId}`, { method:'PATCH', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) });
    const idx = contacts.findIndex(c => c.id === editId);
    if (idx !== -1) contacts[idx] = { ...contacts[idx], ...body };
  } else {
    const res = await fetch(`${API}/contacts`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }).then(r=>r.json());
    contacts.unshift(res);
  }
  closeModal('addModal');
  render();
  showToast('✅ Saved!');
}

async function deleteContact() {
  if (!editId) return;
  await fetch(`${API}/contacts/${editId}`, { method:'DELETE' });
  contacts = contacts.filter(c => c.id !== editId);
  closeModal('addModal');
  render();
  showToast('Deleted');
}

function esc(s) { return (s||'').replace(/</g,'&lt;'); }
function closeModal(id) { document.getElementById(id).classList.remove('open'); }
function closeIfBg(e, id) { if(e.target.id===id) closeModal(id); }
function showToast(msg,ms=2000) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}

load();
</script>
</body>
</html>
