<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXUM Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid #333; margin-bottom: 30px; }
        .logo { font-size: 24px; font-weight: bold; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .user-info { display: flex; gap: 15px; align-items: center; }
        .plan-badge { background: #667eea; padding: 5px 15px; border-radius: 20px; font-size: 12px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; }
        .card { background: #1a1a2e; border-radius: 12px; padding: 20px; border: 1px solid #333; }
        .card h3 { margin-bottom: 15px; color: #667eea; }
        .stat { display: flex; justify-content: space-between; margin: 10px 0; padding: 10px; background: #0f0f1a; border-radius: 8px; }
        .btn { background: #667eea; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-size: 14px; transition: all 0.3s; }
        .btn:hover { background: #764ba2; transform: translateY(-2px); }
        .btn-secondary { background: transparent; border: 1px solid #667eea; margin-left: 10px; }
        .devices-list { margin-top: 15px; }
        .device-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #0f0f1a; border-radius: 8px; margin: 5px 0; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
        .status-dot.offline { background: #ef4444; }
        .api-keys { margin-top: 15px; }
        .key-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; background: #0f0f1a; border-radius: 8px; margin: 5px 0; font-family: monospace; font-size: 12px; }
        .mini-apps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; margin-top: 20px; }
        .app-card { background: #0f0f1a; padding: 20px; border-radius: 8px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .app-card:hover { background: #1a1a2e; transform: translateY(-2px); }
        .app-icon { font-size: 32px; margin-bottom: 10px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo">NEXUM</div>
            <div class="user-info">
                <span id="username">@user</span>
                <span class="plan-badge" id="plan">FREE</span>
                <button class="btn btn-secondary" onclick="upgrade()">Upgrade</button>
            </div>
        </header>

        <div class="grid">
            <div class="card">
                <h3>📊 Usage Statistics</h3>
                <div class="stat">
                    <span>Requests Today</span>
                    <span id="requests-today">0 / 5</span>
                </div>
                <div class="stat">
                    <span>Total Requests</span>
                    <span id="total-requests">0</span>
                </div>
                <div class="stat">
                    <span>AI Provider</span>
                    <span id="ai-provider">Groq (Free)</span>
                </div>
            </div>

            <div class="card">
                <h3>💻 Paired Devices</h3>
                <div class="devices-list" id="devices-list">
                    <div class="device-item">
                        <span>🖥️ No devices paired</span>
                        <button class="btn" onclick="pairDevice()">Pair New</button>
                    </div>
                </div>
            </div>

            <div class="card">
                <h3>🔑 API Keys</h3>
                <div class="api-keys" id="api-keys">
                    <div class="key-item">
                        <span>Using default (Free)</span>
                        <button class="btn btn-secondary" onclick="addKey()">Add Key</button>
                    </div>
                </div>
            </div>

            <div class="card" style="grid-column: 1 / -1;">
                <h3>🚀 Mini Apps</h3>
                <div class="mini-apps">
                    <div class="app-card" onclick="openApp('finance')">
                        <div class="app-icon">💰</div>
                        <div>Finance</div>
                    </div>
                    <div class="app-card" onclick="openApp('tasks')">
                        <div class="app-icon">✅</div>
                        <div>Tasks</div>
                    </div>
                    <div class="app-card" onclick="openApp('notes')">
                        <div class="app-icon">📝</div>
                        <div>Notes</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Mock data - replace with real API calls
        const userData = {
            username: '@tgaziz050',
            plan: 'FREE',
            requestsToday: 3,
            requestsLimit: 5,
            totalRequests: 47,
            aiProvider: 'Groq (Free)',
            devices: [],
            apiKeys: []
        };

        function updateUI() {
            document.getElementById('username').textContent = userData.username;
            document.getElementById('plan').textContent = userData.plan;
            document.getElementById('requests-today').textContent = `${userData.requestsToday} / ${userData.requestsLimit}`;
            document.getElementById('total-requests').textContent = userData.totalRequests;
            document.getElementById('ai-provider').textContent = userData.aiProvider;
        }

        function upgrade() {
            alert('Upgrade to Pro for unlimited requests!');
        }

        function pairDevice() {
            alert('Use /link command in Telegram to pair your PC');
        }

        function addKey() {
            alert('Use /setkey command in Telegram to add your API key');
        }

        function openApp(app) {
            alert(`Opening ${app}... (Coming soon)`);
        }

        updateUI();
    </script>
</body>
</html>
