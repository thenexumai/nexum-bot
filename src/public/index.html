<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEXUM</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;
    --text:#f0f0f0;--muted:#888;--accent:#6366f1;--accent2:#818cf8;
    --green:#22c55e;--red:#ef4444;--yellow:#eab308;--radius:14px;
    --font:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
  }
  body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:100vh;padding:24px 16px}
  .logo{text-align:center;margin-bottom:32px}
  .logo h1{font-size:32px;font-weight:700;letter-spacing:-0.5px}
  .logo h1 span{color:var(--accent)}
  .logo p{color:var(--muted);font-size:15px;margin-top:6px}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:420px;margin:0 auto}
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    padding:20px 16px;text-align:center;cursor:pointer;text-decoration:none;color:inherit;
    transition:background .15s,transform .1s;display:block;
  }
  .card:hover{background:var(--surface2);transform:translateY(-1px)}
  .card:active{transform:scale(.97)}
  .card .icon{font-size:28px;margin-bottom:8px}
  .card .label{font-size:14px;font-weight:600}
  .card .desc{font-size:12px;color:var(--muted);margin-top:3px}
  .footer{text-align:center;margin-top:32px;color:var(--muted);font-size:13px}
</style>
</head>
<body>
<div class="logo">
  <h1>NEX<span>UM</span></h1>
  <p>Your AI Superagent</p>
</div>
<div class="grid">
  <a class="card" href="/finance"><div class="icon">💰</div><div class="label">Finance</div><div class="desc">Track income & expenses</div></a>
  <a class="card" href="/tasks"><div class="icon">✅</div><div class="label">Tasks</div><div class="desc">Manage your to-dos</div></a>
  <a class="card" href="/notes"><div class="icon">📝</div><div class="label">Notes</div><div class="desc">Quick notes & ideas</div></a>
  <a class="card" href="/habits"><div class="icon">🔥</div><div class="label">Habits</div><div class="desc">Build daily streaks</div></a>
  <a class="card" href="/calendar"><div class="icon">📅</div><div class="label">Calendar</div><div class="desc">Events & schedule</div></a>
  <a class="card" href="/contacts"><div class="icon">👤</div><div class="label">Contacts</div><div class="desc">People & connections</div></a>
  <a class="card" href="/agent" style="grid-column:span 2"><div class="icon">🤖</div><div class="label">AI Agent</div><div class="desc">NEXUM Agent panel</div></a>
</div>
<div class="footer">NEXUM v1.0</div>
</body>
</html>
