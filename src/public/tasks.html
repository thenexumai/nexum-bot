<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tasks — NEXUM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;
  --text:#f0f0f0;--muted:#888;--accent:#6366f1;
  --green:#22c55e;--yellow:#eab308;--red:#ef4444;--radius:14px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:20px 16px;max-width:480px;margin:0 auto}
h2{font-size:22px;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:20px}
.add-row{display:flex;gap:8px;margin-bottom:16px}
.add-row input{flex:1;background:var(--surface);border:1px solid var(--border);border-radius:10px;color:var(--text);padding:11px 14px;font-size:14px;font-family:inherit}
.add-row input:focus{outline:none;border-color:var(--accent)}
.add-row input::placeholder{color:var(--muted)}
.btn-add{background:var(--accent);color:#fff;border:none;border-radius:10px;padding:11px 18px;font-size:14px;font-weight:600;cursor:pointer}
.filters{display:flex;gap:6px;margin-bottom:16px;padding-bottom:2px}
.filter{background:transparent;border:1px solid var(--border);border-radius:20px;color:var(--muted);padding:5px 12px;font-size:12px;cursor:pointer}
.filter.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.list{display:flex;flex-direction:column;gap:6px}
.task{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;display:flex;align-items:flex-start;gap:12px}
.task.done{opacity:.5}
.check{width:20px;height:20px;border:2px solid var(--border);border-radius:6px;cursor:pointer;flex-shrink:0;margin-top:1px;display:flex;align-items:center;justify-content:center}
.check.checked{background:var(--green);border-color:var(--green)}
.task-body{flex:1}
.task-title{font-size:14px;font-weight:500}
.task.done .task-title{text-decoration:line-through;color:var(--muted)}
.task-meta{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 7px;border-radius:20px;font-weight:500}
.pri-high{background:#ef444422;color:var(--red)}
.pri-medium{background:#eab30822;color:var(--yellow)}
.pri-low{background:#22c55e22;color:var(--green)}
.del{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;opacity:.6;padding:2px 6px}
.del:hover{opacity:1;color:var(--red)}
.empty{color:var(--muted);text-align:center;padding:32px 0;font-size:14px}
</style>
</head>
<body>
<h2>✅ Tasks</h2>
<p class="subtitle">Stay organized</p>
<div class="add-row">
  <input id="newTask" placeholder="New task..." onkeydown="if(event.key==='Enter')addTask()">
  <button class="btn-add" onclick="addTask()">Add</button>
</div>
<div class="filters">
  <button class="filter active" onclick="setFilter('all',this)">All</button>
  <button class="filter" onclick="setFilter('todo',this)">Todo</button>
  <button class="filter" onclick="setFilter('done',this)">Done</button>
  <button class="filter" onclick="setFilter('high',this)">High</button>
</div>
<div class="list" id="list"><div class="empty">No tasks yet</div></div>
<script>
const uid = new URLSearchParams(location.search).get('uid') || (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) || 0;
let tasks = [], filter = 'all';

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

async function load() {
  if (!uid) return;
  const r = await fetch('/api/tasks?uid=' + uid);
  tasks = await r.json();
  render();
}

function render() {
  const el = document.getElementById('list');
  let list = tasks;
  if (filter === 'todo') list = tasks.filter(t => t.status !== 'done');
  if (filter === 'done') list = tasks.filter(t => t.status === 'done');
  if (filter === 'high') list = tasks.filter(t => t.priority === 'high');
  if (!list.length) { el.innerHTML = '<div class="empty">No tasks here</div>'; return; }
  el.innerHTML = list.map(t => `
    <div class="task ${t.status === 'done' ? 'done' : ''}">
      <div class="check ${t.status === 'done' ? 'checked' : ''}" onclick="toggle(${t.id},'${t.status}')">
        ${t.status === 'done' ? '<svg width="12" height="12" viewBox="0 0 12 12"><polyline points="2,6 5,9 10,3" fill="none" stroke="white" stroke-width="2"/></svg>' : ''}
      </div>
      <div class="task-body">
        <div class="task-title">${t.title}</div>
        <div class="task-meta">
          <span class="badge pri-${t.priority}">${t.priority}</span>
          ${t.project !== 'General' ? '<span class="badge" style="background:#6366f122;color:#818cf8">'+t.project+'</span>' : ''}
          ${t.due_date ? '<span class="badge" style="background:#33333a;color:#aaa">'+t.due_date+'</span>' : ''}
        </div>
      </div>
      <button class="del" onclick="del(${t.id})">×</button>
    </div>
  `).join('');
}

async function addTask() {
  const inp = document.getElementById('newTask');
  const title = inp.value.trim();
  if (!title) return;
  await fetch('/api/tasks', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ uid: parseInt(uid), title })
  });
  inp.value = '';
  load();
}

async function toggle(id, status) {
  const newStatus = status === 'done' ? 'todo' : 'done';
  await fetch('/api/tasks/' + id, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ status: newStatus })
  });
  load();
}

async function del(id) {
  await fetch('/api/tasks/' + id, { method:'DELETE' });
  load();
}

load();
</script>
</body>
</html>
