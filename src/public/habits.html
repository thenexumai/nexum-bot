<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Habits — NEXUM</title>
<link rel="stylesheet" href="/shared/design-system.css">
<style>
  .habit-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 16px;
    margin-bottom: 10px; transition: border-color .15s;
  }
  .habit-card.done-today { border-color: var(--green); background: var(--green-dim); }
  .habit-header { display: flex; align-items: center; gap: 12px; }
  .habit-emoji { font-size: 1.6rem; flex-shrink: 0; }
  .habit-info  { flex: 1; min-width: 0; }
  .habit-name  { font-weight: 700; font-size: 1rem; }
  .habit-freq  { font-size: .75rem; color: var(--text2); margin-top: 2px; }
  .habit-streak { text-align: right; flex-shrink: 0; }
  .streak-num   { font-size: 1.4rem; font-weight: 800; color: var(--yellow); }
  .streak-label { font-size: .65rem; color: var(--text3); }
  .habit-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; }
  .week-dots    { display: flex; gap: 4px; }
  .week-dot {
    width: 22px; height: 22px; border-radius: 50%;
    background: var(--border); display: flex; align-items: center;
    justify-content: center; font-size: .6rem; color: var(--text3);
  }
  .week-dot.done { background: var(--green); color: #fff; }
  .week-dot.today-dot { border: 2px solid var(--accent); }
  .check-btn {
    padding: 7px 16px; border-radius: 99px; border: none; cursor: pointer;
    font-size: .85rem; font-weight: 700; font-family: var(--font);
    transition: all .15s;
  }
  .check-btn.todo   { background: var(--accent); color: #fff; }
  .check-btn.done   { background: var(--green-dim); color: var(--green); }
  .overview-ring {
    width: 80px; height: 80px; flex-shrink: 0;
  }
  .summary-row { display: flex; align-items: center; gap: 16px; margin-bottom: 16px; }
  .summary-text h2 { font-size: 1.4rem; }
  .summary-text p  { font-size: .85rem; color: var(--text2); }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-logo">
    <div class="logo-dot">🔥</div>
    <h1>Habits</h1>
  </div>
  <button class="btn btn-ghost btn-icon" onclick="openModal()">+</button>
</header>

<div class="page">
  <!-- Summary -->
  <div class="card" style="margin-bottom:16px">
    <div class="summary-row">
      <svg class="overview-ring" viewBox="0 0 80 80">
        <circle cx="40" cy="40" r="32" fill="none" stroke="var(--border)" stroke-width="8"/>
        <circle cx="40" cy="40" r="32" fill="none" stroke="var(--green)" stroke-width="8"
          stroke-dasharray="201" stroke-dashoffset="201"
          stroke-linecap="round" transform="rotate(-90 40 40)"
          id="ringCircle"/>
      </svg>
      <div class="summary-text">
        <h2 id="doneToday">0 / 0</h2>
        <p>habits done today</p>
        <div style="margin-top:6px">
          <span class="badge badge-yellow" id="bestStreak">🔥 Best: 0 days</span>
        </div>
      </div>
    </div>
  </div>

  <div id="habitList"></div>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- Add Habit Modal -->
<div class="modal-overlay" id="modal" onclick="closeIfBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>New Habit</h2>
    <div class="form-group">
      <label class="form-label">Emoji</label>
      <input class="input" id="inEmoji" type="text" placeholder="🏃" maxlength="2" style="font-size:1.5rem;text-align:center">
    </div>
    <div class="form-group">
      <label class="form-label">Habit Name</label>
      <input class="input" id="inName" type="text" placeholder="Morning run, Read 30 min...">
    </div>
    <div class="form-group">
      <label class="form-label">Frequency</label>
      <select class="input" id="inFreq">
        <option value="daily">Daily</option>
        <option value="weekdays">Weekdays (Mon–Fri)</option>
        <option value="weekends">Weekends</option>
        <option value="3x_week">3x per week</option>
      </select>
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="addHabit()">Create Habit</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const uid = new URLSearchParams(location.search).get('uid') || 0;
const API = '/api';
let habits = [];

const DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];

async function load() {
  try {
    habits = await fetch(`${API}/habits?uid=${uid}`).then(r => r.json());
    render();
  } catch(e) {
    document.getElementById('habitList').innerHTML = `<div class="empty"><div class="empty-icon">❌</div><h3>${e.message}</h3></div>`;
  }
}

function render() {
  const total = habits.length;
  const doneToday = habits.filter(h => isCheckedToday(h)).length;
  const bestStreak = habits.reduce((max, h) => Math.max(max, h.best_streak || 0), 0);

  document.getElementById('doneToday').textContent = `${doneToday} / ${total}`;
  document.getElementById('bestStreak').textContent = `🔥 Best: ${bestStreak} days`;

  // Ring
  const pct = total ? doneToday / total : 0;
  const circumference = 201;
  document.getElementById('ringCircle').style.strokeDashoffset = circumference * (1 - pct);

  const el = document.getElementById('habitList');
  if (!habits.length) {
    el.innerHTML = `<div class="empty"><div class="empty-icon">🔥</div><h3>No habits yet</h3><p>Build your first habit below</p></div>`;
    return;
  }

  const today = new Date().getDay();
  el.innerHTML = habits.map(h => {
    const done = isCheckedToday(h);
    const weekDots = DAYS.map((d, i) => {
      const isToday = i === today;
      const isDone = isCheckedDay(h, i);
      return `<div class="week-dot ${isDone ? 'done' : ''} ${isToday ? 'today-dot' : ''}">${d}</div>`;
    }).join('');

    return `
    <div class="habit-card ${done ? 'done-today' : ''}">
      <div class="habit-header">
        <div class="habit-emoji">${h.emoji || '⭐'}</div>
        <div class="habit-info">
          <div class="habit-name">${esc(h.name)}</div>
          <div class="habit-freq">${fmtFreq(h.frequency)}</div>
        </div>
        <div class="habit-streak">
          <div class="streak-num">${h.streak || 0}</div>
          <div class="streak-label">streak</div>
        </div>
      </div>
      <div class="habit-footer">
        <div class="week-dots">${weekDots}</div>
        <button class="check-btn ${done ? 'done' : 'todo'}" onclick="toggleHabit(${h.id})">
          ${done ? '✓ Done' : 'Check in'}
        </button>
      </div>
    </div>`;
  }).join('');
}

function isCheckedToday(h) {
  if (!h.last_checked) return false;
  return new Date(h.last_checked).toDateString() === new Date().toDateString();
}

function isCheckedDay(h, dayIndex) {
  // Approximate from streak data — server should send week_log ideally
  if (dayIndex === new Date().getDay()) return isCheckedToday(h);
  return false;
}

function fmtFreq(f) {
  const map = { daily: 'Every day', weekdays: 'Mon–Fri', weekends: 'Weekends', '3x_week': '3× per week' };
  return map[f] || f;
}

function esc(s) { return (s||'').replace(/</g,'&lt;'); }

async function toggleHabit(id) {
  const h = habits.find(x => x.id === id);
  if (!h) return;
  const done = isCheckedToday(h);
  if (done) return; // can't un-check

  await fetch(`${API}/habits/${id}/checkin`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ uid }) });
  h.last_checked = new Date().toISOString();
  h.streak = (h.streak || 0) + 1;
  if (h.streak > (h.best_streak || 0)) h.best_streak = h.streak;
  render();
  showToast('🔥 Checked in!');
}

async function addHabit() {
  const name = document.getElementById('inName').value.trim();
  if (!name) return showToast('Enter habit name');
  const body = {
    uid, name,
    emoji: document.getElementById('inEmoji').value || '⭐',
    frequency: document.getElementById('inFreq').value,
    streak: 0, best_streak: 0,
  };
  const res = await fetch(`${API}/habits`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(r => r.json());
  habits.unshift(res);
  closeModal();
  render();
  showToast('✅ Habit created!');
  document.getElementById('inName').value = '';
  document.getElementById('inEmoji').value = '';
}

function openModal() { document.getElementById('modal').classList.add('open'); }
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeIfBg(e) { if (e.target.id === 'modal') closeModal(); }
function showToast(msg, ms = 2000) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), ms);
}

load();
</script>
</body>
</html>
