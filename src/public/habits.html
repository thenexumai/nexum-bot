<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Habits — NEXUM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--bg2:#0a0a0a;--bg3:#1c1c1e;--bg4:#2c2c2e;--bg5:#3a3a3c;
  --fg:#fff;--fg2:rgba(255,255,255,0.6);--fg3:rgba(255,255,255,0.3);--sep:rgba(255,255,255,0.08);
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#5ac8fa;
  --r:16px;--font:-apple-system,"SF Pro Display",system-ui,sans-serif;
}
html,body{min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{display:none}

.header{padding:16px 20px 12px;display:flex;align-items:center;justify-content:space-between}
.back{width:32px;height:32px;border-radius:50%;background:var(--bg3);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:var(--fg2)}
.back svg,.add-btn svg{width:18px;height:18px;fill:currentColor}
.title{font-size:17px;font-weight:600}
.add-btn{width:32px;height:32px;border-radius:50%;background:var(--purple);display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;color:#fff}

/* Stats bar */
.stats-bar{display:flex;gap:10px;padding:0 20px 20px}
.stat-card{flex:1;background:var(--bg3);border-radius:14px;padding:14px 12px;text-align:center}
.stat-num{font-size:24px;font-weight:700;letter-spacing:-1px;line-height:1}
.stat-num.green{color:var(--green)}
.stat-num.orange{color:var(--orange)}
.stat-num.purple{color:var(--purple)}
.stat-lbl{font-size:11px;color:var(--fg2);margin-top:4px;font-weight:500}

/* Date row */
.date-row{display:flex;gap:5px;padding:0 20px 20px;overflow-x:auto;scrollbar-width:none}
.date-chip{flex-shrink:0;width:44px;text-align:center;cursor:pointer}
.date-day{font-size:11px;color:var(--fg3);margin-bottom:6px;font-weight:500}
.date-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;margin:0 auto;color:var(--fg2)}
.date-chip.today .date-num{background:var(--blue);color:#fff}
.date-chip.sel .date-num{background:var(--bg4);color:var(--fg)}

.sec{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg3);padding:0 20px 10px}

.habit-row{display:flex;align-items:center;margin:0 20px 10px;background:var(--bg3);border-radius:14px;padding:16px;gap:14px;cursor:pointer;transition:transform 0.15s,opacity 0.15s;position:relative}
.habit-row:active{transform:scale(0.97);opacity:0.85}
.habit-check{width:32px;height:32px;border-radius:50%;border:2.5px solid var(--bg5);display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all 0.25s cubic-bezier(0.34,1.56,0.64,1)}
.habit-check.done{background:var(--green);border-color:var(--green);transform:scale(1.1)}
.habit-check svg{width:16px;height:16px;fill:#fff;opacity:0;transition:opacity 0.2s}
.habit-check.done svg{opacity:1}
.habit-body{flex:1;min-width:0}
.habit-name{font-size:15px;font-weight:500}
.habit-streak{font-size:12px;color:var(--fg2);margin-top:2px;display:flex;align-items:center;gap:4px}
.streak-bar{display:flex;gap:3px;margin-top:8px;flex-wrap:wrap}
.streak-dot{width:8px;height:8px;border-radius:50%;background:var(--bg4);transition:background 0.2s;flex-shrink:0}
.streak-dot.done{background:var(--green)}
.habit-best{font-size:11px;color:var(--fg3);text-align:right}

.empty{padding:40px 20px;text-align:center;color:var(--fg2);font-size:14px}
.pb{height:env(safe-area-inset-bottom,28px)}

/* Sheet */
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:10;display:none;backdrop-filter:blur(4px)}
.sheet-bg.show{display:block}
.sheet{position:fixed;bottom:0;left:0;right:0;background:var(--bg2);border-radius:24px 24px 0 0;z-index:11;padding:12px 20px 40px;transform:translateY(100%);transition:transform 0.35s cubic-bezier(0.32,0.72,0,1)}
.sheet.show{transform:translateY(0)}
.sheet-handle{width:36px;height:4px;background:var(--bg5);border-radius:2px;margin:0 auto 20px}
.sheet-title{font-size:17px;font-weight:600;margin-bottom:20px;text-align:center}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--fg2);font-weight:500;margin-bottom:6px}
.field input{width:100%;background:var(--bg3);border:1.5px solid transparent;border-radius:10px;padding:13px 14px;color:var(--fg);font-family:var(--font);font-size:15px;outline:none;transition:border-color 0.15s}
.field input:focus{border-color:var(--purple)}
.field input::placeholder{color:var(--fg3)}
.save-btn{width:100%;padding:16px;background:var(--purple);border:none;border-radius:14px;color:#fff;font-family:var(--font);font-size:16px;font-weight:600;cursor:pointer;margin-top:4px}

@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.stats-bar{animation:fadeUp 0.3s ease both}
.habit-row{animation:fadeUp 0.3s ease both}
</style>
</head>
<body>
<div class="header">
  <button class="back" onclick="history.back()">
    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
  </button>
  <span class="title">Habits</span>
  <button class="add-btn" onclick="openSheet()">
    <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
  </button>
</div>

<div class="stats-bar" id="stats-bar">
  <div class="stat-card"><div class="stat-num green" id="done-today">0</div><div class="stat-lbl">Today</div></div>
  <div class="stat-card"><div class="stat-num orange" id="best-streak">0</div><div class="stat-lbl">Best Streak</div></div>
  <div class="stat-card"><div class="stat-num purple" id="total-habits">0</div><div class="stat-lbl">Habits</div></div>
</div>

<div class="date-row" id="date-row"></div>

<div class="sec">DAILY HABITS</div>
<div id="habits-list"><div class="empty">Loading...</div></div>
<div class="pb"></div>

<div class="sheet-bg" id="sheet-bg" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-title">New Habit</div>
  <div class="field"><label>Habit name</label><input type="text" id="f-name" placeholder="Exercise, Read, Meditate..."></div>
  <button class="save-btn" onclick="saveHabit()">Create Habit</button>
</div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const BASE = window.location.origin;
const params = new URLSearchParams(window.location.search);
const initData = params.get('initData') || (tg?.initData || '');

let habits = [];
const today = new Date().toISOString().split('T')[0];

// Date row — last 7 days
function buildDateRow() {
  const el = document.getElementById('date-row');
  const DAYS = ['Su','Mo','Tu','We','Th','Fr','Sa'];
  const chips = [];
  for (let i = 6; i >= 0; i--) {
    const d = new Date(); d.setDate(d.getDate() - i);
    const iso = d.toISOString().split('T')[0];
    const isToday = iso === today;
    chips.push(`<div class="date-chip${isToday ? ' today sel' : ''}">
      <div class="date-day">${DAYS[d.getDay()]}</div>
      <div class="date-num">${d.getDate()}</div>
    </div>`);
  }
  el.innerHTML = chips.join('');
}
buildDateRow();

async function load() {
  try {
    const url = BASE + '/api/habits' + (initData ? '?initData=' + encodeURIComponent(initData) : '');
    const r = await fetch(url);
    const d = await r.json();
    if (!d.ok) return;
    habits = d.data;
    render();
  } catch { document.getElementById('habits-list').innerHTML = '<div class="empty">Failed to load</div>'; }
}

function render() {
  const doneToday = habits.filter(h => h.done_today).length;
  const bestStreak = habits.reduce((max, h) => Math.max(max, h.best_streak || 0), 0);
  document.getElementById('done-today').textContent = doneToday;
  document.getElementById('best-streak').textContent = bestStreak;
  document.getElementById('total-habits').textContent = habits.length;

  const el = document.getElementById('habits-list');
  if (!habits.length) { el.innerHTML = '<div class="empty">No habits yet. Create your first habit!</div>'; return; }

  el.innerHTML = habits.map((h, i) => {
    const dots = Array.from({length: 30}, (_, j) => {
      const d = new Date(); d.setDate(d.getDate() - (29 - j));
      const iso = d.toISOString().split('T')[0];
      return `<div class="streak-dot${(h.logs||[]).includes(iso) ? ' done' : ''}"></div>`;
    }).join('');
    return `
      <div class="habit-row" onclick="toggleHabit(${h.id})" style="animation-delay:${i*0.04}s">
        <div class="habit-check${h.done_today ? ' done' : ''}" id="check-${h.id}">
          <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
        </div>
        <div class="habit-body">
          <div class="habit-name">${esc(h.name)}</div>
          <div class="habit-streak">${h.streak > 0 ? h.streak + ' day streak' : 'Start today'}</div>
          <div class="streak-bar">${dots}</div>
        </div>
        <div class="habit-best">${h.best_streak > 0 ? 'Best: ' + h.best_streak : ''}</div>
      </div>
    `;
  }).join('');
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

async function toggleHabit(id) {
  const h = habits.find(x => x.id === id);
  if (!h) return;
  h.done_today = !h.done_today;
  if (h.done_today) { h.streak = (h.streak||0)+1; } else { h.streak = Math.max(0, (h.streak||0)-1); }
  render();
  if (tg) tg.HapticFeedback?.impactOccurred(h.done_today ? 'medium' : 'light');
  await fetch(BASE + '/api/habits/' + id + '/toggle', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ initData }),
  });
  load(); // refresh from server
}

function openSheet() {
  document.getElementById('sheet-bg').classList.add('show');
  document.getElementById('sheet').classList.add('show');
  setTimeout(() => document.getElementById('f-name').focus(), 350);
}
function closeSheet() {
  document.getElementById('sheet-bg').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}
async function saveHabit() {
  const name = document.getElementById('f-name').value.trim();
  if (!name) return;
  await fetch(BASE + '/api/habits', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name, initData }),
  });
  document.getElementById('f-name').value = '';
  if (tg) tg.HapticFeedback?.notificationOccurred('success');
  closeSheet();
  load();
}

load();
</script>
</body>
</html>
