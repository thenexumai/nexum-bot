<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calendar — NEXUM</title>
<link rel="stylesheet" href="/shared/design-system.css">
<style>
  .cal-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .cal-nav { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 6px 12px; cursor: pointer; color: var(--text); font-size: 1rem; }
  .cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; margin-bottom: 16px; }
  .cal-dow  { text-align: center; font-size: .7rem; font-weight: 700; color: var(--text3); padding: 4px 0; text-transform: uppercase; }
  .cal-day  {
    aspect-ratio: 1; border-radius: var(--radius-sm);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    cursor: pointer; font-size: .85rem; font-weight: 500; position: relative;
    transition: background .1s;
  }
  .cal-day:hover    { background: var(--surface2); }
  .cal-day.other    { color: var(--text3); }
  .cal-day.today    { background: var(--accent); color: #fff; font-weight: 700; }
  .cal-day.selected { background: var(--accent-dim); border: 1px solid var(--accent); color: var(--accent2); }
  .cal-day.has-event::after {
    content: ''; position: absolute; bottom: 3px;
    width: 4px; height: 4px; border-radius: 50%; background: var(--green);
  }
  .cal-day.today.has-event::after { background: #fff; }
  .events-section h3 { font-size: .8rem; color: var(--text3); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 8px; }
  .event-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px; border-radius: var(--radius-sm);
    background: var(--surface); border: 1px solid var(--border);
    margin-bottom: 8px;
  }
  .event-time { font-size: .8rem; color: var(--accent2); font-weight: 700; min-width: 50px; padding-top: 2px; }
  .event-title { font-weight: 600; font-size: .9rem; }
  .event-sub   { font-size: .75rem; color: var(--text2); margin-top: 2px; }
  .event-dot   { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); flex-shrink: 0; margin-top: 6px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-logo">
    <div class="logo-dot">📅</div>
    <h1>Calendar</h1>
  </div>
  <button class="btn btn-ghost btn-icon" onclick="openModal()">+</button>
</header>

<div class="page">
  <!-- Month nav -->
  <div class="cal-header">
    <button class="cal-nav" onclick="prevMonth()">‹</button>
    <h2 id="monthLabel" style="font-size:1.1rem"></h2>
    <button class="cal-nav" onclick="nextMonth()">›</button>
  </div>

  <!-- Day-of-week labels -->
  <div class="cal-grid" id="calDow"></div>

  <!-- Calendar grid -->
  <div class="cal-grid" id="calGrid"></div>

  <!-- Events for selected day -->
  <div class="events-section">
    <h3 id="eventsLabel">Today's Events</h3>
    <div id="eventsList"></div>
  </div>
</div>

<button class="fab" onclick="openModal()">+</button>

<!-- Add Event Modal -->
<div class="modal-overlay" id="modal" onclick="closeIfBg(event)">
  <div class="modal">
    <div class="modal-handle"></div>
    <h2>New Event</h2>
    <div class="form-group">
      <label class="form-label">Title</label>
      <input class="input" id="inTitle" type="text" placeholder="Meeting, Birthday, Deadline...">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label class="form-label">Date</label>
        <input class="input" id="inDate" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">Time</label>
        <input class="input" id="inTime" type="time">
      </div>
    </div>
    <div class="form-group">
      <label class="form-label">Note (optional)</label>
      <input class="input" id="inNote" type="text" placeholder="Location, details...">
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="addEvent()">Save Event</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const uid = new URLSearchParams(location.search).get('uid') || 0;
const API = '/api';
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let events = [];
let today = new Date();
let viewing = new Date(today.getFullYear(), today.getMonth(), 1);
let selectedDate = toYMD(today);

function toYMD(d) { return d.toISOString().slice(0,10); }

async function load() {
  try {
    events = await fetch(`${API}/calendar?uid=${uid}`).then(r => r.json());
    renderCal();
    renderEvents(selectedDate);
  } catch(e) {}
}

function renderCal() {
  document.getElementById('monthLabel').textContent = `${MONTHS[viewing.getMonth()]} ${viewing.getFullYear()}`;

  // DOW headers
  document.getElementById('calDow').innerHTML = DOW.map(d => `<div class="cal-dow">${d}</div>`).join('');

  const first = new Date(viewing.getFullYear(), viewing.getMonth(), 1);
  const last  = new Date(viewing.getFullYear(), viewing.getMonth() + 1, 0);
  const startPad = first.getDay();
  const todayYMD = toYMD(today);

  const eventDays = new Set(events.map(e => e.start?.slice(0,10)).filter(Boolean));

  let cells = '';
  // Pad before
  const prevLast = new Date(viewing.getFullYear(), viewing.getMonth(), 0).getDate();
  for (let i = startPad - 1; i >= 0; i--) {
    cells += `<div class="cal-day other">${prevLast - i}</div>`;
  }
  // Current month
  for (let d = 1; d <= last.getDate(); d++) {
    const ymd = `${viewing.getFullYear()}-${String(viewing.getMonth()+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
    const isToday    = ymd === todayYMD;
    const isSelected = ymd === selectedDate;
    const hasEv      = eventDays.has(ymd);
    cells += `<div class="cal-day ${isToday?'today':''} ${isSelected&&!isToday?'selected':''} ${hasEv?'has-event':''}" onclick="selectDay('${ymd}')">${d}</div>`;
  }
  // Pad after
  const remaining = 42 - startPad - last.getDate();
  for (let d = 1; d <= remaining; d++) {
    cells += `<div class="cal-day other">${d}</div>`;
  }

  document.getElementById('calGrid').innerHTML = cells;
}

function renderEvents(ymd) {
  const dayEvents = events.filter(e => e.start?.slice(0,10) === ymd);
  const label = ymd === toYMD(today) ? "Today's Events" : `Events on ${ymd}`;
  document.getElementById('eventsLabel').textContent = label;

  const el = document.getElementById('eventsList');
  if (!dayEvents.length) {
    el.innerHTML = `<div class="empty" style="padding:24px"><div class="empty-icon" style="font-size:2rem">📭</div><h3 style="font-size:.9rem">No events</h3></div>`;
    return;
  }
  el.innerHTML = dayEvents.map(e => {
    const time = e.start?.slice(11,16) || '';
    return `
    <div class="event-item">
      <div class="event-dot"></div>
      <div style="flex:1">
        <div class="event-title">${esc(e.title)}</div>
        ${e.note ? `<div class="event-sub">📍 ${esc(e.note)}</div>` : ''}
      </div>
      ${time ? `<div class="event-time">${time}</div>` : ''}
    </div>`;
  }).join('');
}

function selectDay(ymd) { selectedDate = ymd; renderCal(); renderEvents(ymd); }
function prevMonth() { viewing.setMonth(viewing.getMonth()-1); renderCal(); }
function nextMonth() { viewing.setMonth(viewing.getMonth()+1); renderCal(); }

async function addEvent() {
  const title = document.getElementById('inTitle').value.trim();
  const date  = document.getElementById('inDate').value;
  if (!title || !date) return showToast('Title and date required');
  const time = document.getElementById('inTime').value;
  const start = time ? `${date}T${time}:00` : `${date}T00:00:00`;
  const body = { uid, title, start, note: document.getElementById('inNote').value, all_day: !time };
  const res = await fetch(`${API}/calendar`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body) }).then(r=>r.json());
  events.push(res);
  closeModal();
  renderCal();
  renderEvents(date);
  showToast('✅ Event saved!');
  document.getElementById('inTitle').value='';
  document.getElementById('inNote').value='';
}

function esc(s) { return (s||'').replace(/</g,'&lt;'); }
function openModal() {
  document.getElementById('inDate').value = selectedDate;
  document.getElementById('modal').classList.add('open');
}
function closeModal() { document.getElementById('modal').classList.remove('open'); }
function closeIfBg(e) { if(e.target.id==='modal') closeModal(); }
function showToast(msg,ms=2000) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}

// Set default date to today
document.getElementById('inDate').value = toYMD(today);
load();
</script>
</body>
</html>
