<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Agent — NEXUM</title>
<link rel="stylesheet" href="/shared/design-system.css">
<style>
* { box-sizing: border-box; }
body { display:flex; flex-direction:column; height:100dvh; overflow:hidden; background:var(--bg); }

/* ===== HEADER ===== */
.nx-header {
  flex-shrink:0; display:flex; align-items:center; justify-content:space-between;
  padding:0 14px; height:52px;
  background:rgba(12,12,13,.9);
  border-bottom:1px solid var(--border);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  position:sticky; top:0; z-index:50;
}
.nx-header-left { display:flex; align-items:center; gap:10px; }
.nx-logo-sm {
  width:28px; height:28px; border-radius:8px;
  background:#0c0c0d; border:1px solid rgba(31,178,166,.3);
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 0 0 1px rgba(31,178,166,.08), 0 2px 8px rgba(31,178,166,.15);
}
.nx-logo-sm svg { width:16px; height:16px; }
.nx-header h1 { font-size:.92rem; font-weight:700; letter-spacing:-.02em; }
.nx-header-right { display:flex; align-items:center; gap:4px; }
.icon-btn {
  width:34px; height:34px; border-radius:9px;
  border:none; background:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:var(--text2); transition:all .15s;
}
.icon-btn:hover { background:var(--surface2); color:var(--text); }
.icon-btn svg { width:17px; height:17px; stroke:currentColor; fill:none; stroke-width:1.8; stroke-linecap:round; stroke-linejoin:round; }

/* ===== SIDEBAR (chat list) ===== */
.sidebar {
  position:fixed; left:0; top:0; bottom:0; width:260px; z-index:200;
  background:var(--bg2); border-right:1px solid var(--border);
  display:flex; flex-direction:column;
  transform:translateX(-100%);
  transition:transform .25s cubic-bezier(.16,1,.3,1);
}
.sidebar.open { transform:translateX(0); }
.sidebar-overlay {
  position:fixed; inset:0; z-index:199; background:rgba(0,0,0,.5);
  opacity:0; pointer-events:none; transition:opacity .2s;
}
.sidebar-overlay.open { opacity:1; pointer-events:all; }
.sidebar-header {
  display:flex; align-items:center; justify-content:space-between;
  padding:14px 14px 10px;
  border-bottom:1px solid var(--border);
}
.sidebar-header h2 { font-size:.88rem; font-weight:700; color:var(--text2); letter-spacing:.04em; text-transform:uppercase; }
.new-chat-btn {
  display:flex; align-items:center; gap:7px;
  padding:9px 14px; margin:10px;
  background:var(--accent-dim); border:1px solid var(--accent-border);
  border-radius:var(--radius-sm); color:var(--accent);
  font-size:.83rem; font-weight:600; cursor:pointer;
  transition:all .15s; font-family:var(--font);
}
.new-chat-btn:hover { background:var(--accent); color:#fff; }
.new-chat-btn svg { width:15px; height:15px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.chats-list { flex:1; overflow-y:auto; padding:0 8px 10px; }
.chat-item {
  display:flex; align-items:center; gap:9px;
  padding:9px 10px; border-radius:var(--radius-sm);
  cursor:pointer; color:var(--text2); font-size:.83rem;
  transition:all .15s; border:1px solid transparent;
  margin-bottom:2px;
}
.chat-item:hover { background:var(--surface); color:var(--text); }
.chat-item.active { background:var(--surface); border-color:var(--border); color:var(--text); }
.chat-item-icon { font-size:1rem; flex-shrink:0; }
.chat-item-title { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:.82rem; }
.chat-item-del { opacity:0; background:none; border:none; cursor:pointer; color:var(--text3); padding:2px 4px; border-radius:4px; font-size:.75rem; }
.chat-item:hover .chat-item-del { opacity:1; }
.chat-item-del:hover { color:var(--red); }

/* ===== MAIN ===== */
.main-wrap { flex:1; display:flex; flex-direction:column; overflow:hidden; }

/* Toolbar chips */
#toolbar {
  flex-shrink:0; display:flex; gap:5px; padding:8px 14px 6px;
  overflow-x:auto; scrollbar-width:none;
  border-bottom:1px solid var(--border);
}
#toolbar::-webkit-scrollbar { display:none; }
.tool-chip {
  display:inline-flex; align-items:center; gap:5px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-full); padding:5px 12px;
  font-size:.74rem; font-weight:600; color:var(--text2);
  cursor:pointer; white-space:nowrap; transition:all .15s;
  font-family:var(--font);
}
.tool-chip:hover { border-color:var(--border2); color:var(--text); }
.tool-chip.active { border-color:var(--accent-border); color:var(--accent); background:var(--accent-dim); }

/* Chat area */
#chatArea {
  flex:1; overflow-y:auto; padding:14px 14px 6px;
  display:flex; flex-direction:column; gap:12px;
  scroll-behavior:smooth;
}

/* Messages */
.msg-wrap { display:flex; flex-direction:column; gap:4px; }
.msg-wrap.user { align-items:flex-end; }
.msg-wrap.assistant { align-items:flex-start; }
.msg-label { font-size:.68rem; font-weight:600; color:var(--text3); letter-spacing:.03em; padding:0 4px; }

.msg {
  max-width:88%; padding:11px 15px;
  border-radius:var(--radius-md);
  font-size:.9rem; line-height:1.6; word-break:break-word;
  animation:msgIn .22s cubic-bezier(.16,1,.3,1) both;
}
@keyframes msgIn { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
.msg.user { background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
.msg.assistant { background:var(--surface); border:1px solid var(--border); color:var(--text); border-bottom-left-radius:4px; }

/* Streaming cursor */
.msg.assistant.streaming::after { content:'▌'; animation:blink .7s infinite; color:var(--accent); font-size:.8em; margin-left:2px; }
@keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }

/* Markdown */
.msg.assistant code { background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-xs); padding:1px 5px; font-family:var(--font-mono); font-size:.81rem; }
.msg.assistant pre { background:var(--bg3); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; overflow-x:auto; font-family:var(--font-mono); font-size:.79rem; margin:10px 0 4px; line-height:1.5; position:relative; }
.msg.assistant pre code { background:none; border:none; padding:0; }
.msg.assistant ul, .msg.assistant ol { padding-left:18px; margin:6px 0; }
.msg.assistant li { margin-bottom:3px; }
.msg.assistant p { margin:0 0 7px; color:var(--text); }
.msg.assistant p:last-child { margin-bottom:0; }
.msg.assistant h1,.msg.assistant h2,.msg.assistant h3 { color:var(--text); margin:10px 0 5px; }
.msg.assistant h1 { font-size:1.05rem; }
.msg.assistant h2 { font-size:.97rem; }
.msg.assistant h3 { font-size:.9rem; }
.msg.assistant a { color:var(--accent); text-decoration:underline; text-underline-offset:2px; }
.msg.assistant blockquote { border-left:3px solid var(--accent); padding-left:12px; color:var(--text2); margin:8px 0; }
.msg.assistant table { margin:8px 0; font-size:.83rem; width:100%; }
.msg.assistant table th,.msg.assistant table td { padding:6px 10px; border:1px solid var(--border); }
.msg.assistant table th { background:var(--surface2); font-weight:600; }

/* Sources (Perplexity style) */
.msg-sources { margin-top:10px; }
.sources-label { font-size:.7rem; color:var(--text3); font-weight:600; text-transform:uppercase; letter-spacing:.05em; margin-bottom:7px; }
.sources-pills { display:flex; flex-wrap:wrap; gap:5px; }
.source-pill {
  display:inline-flex; align-items:center; gap:5px;
  background:var(--surface2); border:1px solid var(--border);
  border-radius:var(--radius-full); padding:3px 10px 3px 4px;
  font-size:.72rem; color:var(--text2); text-decoration:none;
  transition:all .15s; max-width:180px;
}
.source-pill:hover { border-color:var(--accent-border); color:var(--accent); background:var(--accent-dim); }
.source-pill-num {
  background:var(--surface3); color:var(--text2);
  width:18px; height:18px; border-radius:50%;
  display:inline-flex; align-items:center; justify-content:center;
  font-size:.63rem; font-weight:700; flex-shrink:0;
}
.source-pill-title { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }

/* Thinking dots */
.thinking-wrap { display:flex; align-items:flex-start; gap:9px; }
.thinking-avatar {
  width:28px; height:28px; border-radius:8px;
  background:var(--surface2); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0;
}
.think-dots { display:flex; gap:4px; padding:12px 15px; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); border-bottom-left-radius:4px; }
.think-dots span { width:6px; height:6px; border-radius:50%; background:var(--accent); opacity:.3; animation:thinkDot 1.4s infinite; }
.think-dots span:nth-child(2){animation-delay:.18s} .think-dots span:nth-child(3){animation-delay:.36s}
@keyframes thinkDot{0%,80%,100%{opacity:.2;transform:scale(.7)} 40%{opacity:1;transform:scale(1)}}

/* Empty state */
#emptyState {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; padding:24px 20px; text-align:center; color:var(--text3);
}
#emptyState .es-logo {
  width:56px; height:56px; border-radius:16px;
  background:var(--surface); border:1px solid var(--border);
  display:flex; align-items:center; justify-content:center;
  margin-bottom:8px;
  box-shadow:0 4px 24px rgba(31,178,166,.12);
}
#emptyState .es-logo svg { width:28px; height:28px; }
#emptyState h3 { font-size:1rem; font-weight:700; color:var(--text2); margin:0; }
#emptyState p { font-size:.82rem; margin:0; max-width:220px; line-height:1.5; }
.suggestion-grid { display:grid; grid-template-columns:1fr 1fr; gap:7px; margin-top:16px; width:100%; max-width:310px; }
.suggestion {
  background:var(--surface); border:1px solid var(--border);
  border-radius:var(--radius-sm); padding:10px 12px;
  font-size:.77rem; color:var(--text2); cursor:pointer; text-align:left;
  transition:all .15s; line-height:1.4; font-family:var(--font);
}
.suggestion:hover { border-color:var(--accent-border); color:var(--text); background:var(--surface2); }
.suggestion .sug-icon { display:block; font-size:1rem; margin-bottom:4px; }

/* ===== INPUT AREA (Perplexity style) ===== */
.input-area {
  flex-shrink:0;
  padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  background:var(--bg);
  border-top:1px solid var(--border);
}
.input-box {
  background:var(--surface);
  border:1px solid var(--border2);
  border-radius:var(--radius-xl);
  transition:border-color .2s, box-shadow .2s;
  overflow:hidden;
}
.input-box:focus-within {
  border-color:var(--accent-border);
  box-shadow:0 0 0 3px var(--accent-dim), 0 4px 20px rgba(0,0,0,.25);
}

/* Image preview */
#imgPreviewWrap {
  display:none; padding:8px 12px 0; gap:6px; flex-wrap:wrap;
}
#imgPreviewWrap.has-img { display:flex; }
.img-thumb {
  position:relative; width:56px; height:56px; border-radius:8px;
  overflow:hidden; border:1px solid var(--border);
}
.img-thumb img { width:100%; height:100%; object-fit:cover; }
.img-thumb-del {
  position:absolute; top:2px; right:2px;
  width:16px; height:16px; border-radius:50%;
  background:rgba(0,0,0,.7); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-size:.6rem;
}

.input-row {
  display:flex; align-items:flex-end; gap:8px;
  padding:10px 10px 8px 14px;
}
#msgInput {
  flex:1; resize:none; min-height:22px; max-height:160px;
  padding:2px 0; font-family:var(--font); font-size:.9rem;
  background:none; border:none; outline:none;
  color:var(--text); line-height:1.55;
}
#msgInput::placeholder { color:var(--text3); }

.input-actions {
  display:flex; align-items:center; gap:3px;
  padding:0 10px 8px 12px;
  border-top:1px solid var(--border);
  margin-top:2px;
}
.action-chip {
  display:inline-flex; align-items:center; gap:4px;
  padding:4px 9px; border-radius:var(--radius-full);
  background:none; border:1px solid var(--border);
  color:var(--text3); font-size:.72rem; font-weight:500;
  cursor:pointer; transition:all .15s; font-family:var(--font);
  white-space:nowrap;
}
.action-chip:hover { border-color:var(--accent-border); color:var(--accent); background:var(--accent-dim); }
.action-chip.active { border-color:var(--accent-border); color:var(--accent); background:var(--accent-dim); }
.action-chip svg { width:12px; height:12px; stroke:currentColor; fill:none; stroke-width:2; stroke-linecap:round; stroke-linejoin:round; }
.action-spacer { flex:1; }

.send-btn {
  width:34px; height:34px; border-radius:50%;
  background:var(--accent); border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all .15s;
  box-shadow:0 2px 8px var(--accent-glow);
}
.send-btn:hover { background:var(--accent2); transform:scale(1.06); }
.send-btn:active { transform:scale(.92); }
.send-btn:disabled { background:var(--surface3); box-shadow:none; cursor:not-allowed; opacity:.5; }
.send-btn svg { width:15px; height:15px; fill:#fff; }

.stop-btn {
  width:34px; height:34px; border-radius:50%;
  background:var(--surface2); border:1px solid var(--border2);
  cursor:pointer; display:flex; align-items:center; justify-content:center;
  flex-shrink:0; transition:all .15s;
}
.stop-btn:hover { background:var(--red-dim); border-color:var(--red-border); }
.stop-btn svg { width:14px; height:14px; fill:var(--text2); }

/* Toast */
.toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--surface3); border:1px solid var(--border2); color:var(--text); padding:8px 18px; border-radius:var(--radius-full); font-size:.81rem; font-weight:500; box-shadow:var(--shadow); opacity:0; transition:all .2s; pointer-events:none; white-space:nowrap; z-index:999; }
.toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
.toast.error { border-color:var(--red-border); color:var(--red); }
.toast.success { border-color:var(--green-border); color:var(--green); }

/* File input hidden */
#fileInput { display:none; }
</style>
</head>
<body>

<!-- Sidebar overlay -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <h2>Чаты</h2>
    <button class="icon-btn" onclick="closeSidebar()">
      <svg viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg>
    </button>
  </div>
  <button class="new-chat-btn" onclick="newChat()">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    Новый чат
  </button>
  <div class="chats-list" id="chatsList"></div>
</aside>

<!-- Header -->
<header class="nx-header">
  <div class="nx-header-left">
    <button class="icon-btn" onclick="openSidebar()">
      <svg viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
    </button>
    <div class="nx-logo-sm">
      <svg viewBox="0 0 16 16" fill="none">
        <path d="M3 3L3 13L5.5 13L5.5 7.5L10.5 13L13 13L13 3L10.5 3L10.5 8.5L5.5 3L3 3Z" fill="#1fb2a6"/>
      </svg>
    </div>
    <h1 id="chatTitle">AI Агент</h1>
  </div>
  <div class="nx-header-right">
    <button class="icon-btn" onclick="newChat()" title="Новый чат">
      <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <button class="icon-btn" onclick="clearChat()" title="Очистить">
      <svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
    </button>
  </div>
</header>

<!-- Toolbar -->
<div id="toolbar">
  <button class="tool-chip active" id="chip-chat" onclick="setMode('chat')">💬 Чат</button>
  <button class="tool-chip" id="chip-search" onclick="setMode('search')">
    <svg viewBox="0 0 16 16" fill="none" style="width:12px;height:12px;stroke:currentColor;stroke-width:1.8;stroke-linecap:round"><circle cx="6.5" cy="6.5" r="4"/><path d="M11 11l2.5 2.5"/></svg>
    Поиск
  </button>
  <button class="tool-chip" id="chip-code" onclick="setMode('code')">💻 Код</button>
  <button class="tool-chip" id="chip-think" onclick="setMode('think')">🧠 Анализ</button>
  <button class="tool-chip" id="chip-memory" onclick="setMode('memory')">⚡ Память</button>
</div>

<!-- Main -->
<div class="main-wrap">
  <div id="emptyState">
    <div class="es-logo">
      <svg viewBox="0 0 28 28" fill="none">
        <path d="M5 5L5 23L9.5 23L9.5 13.5L18.5 23L23 23L23 5L18.5 5L18.5 14.5L9.5 5L5 5Z" fill="#1fb2a6"/>
      </svg>
    </div>
    <h3>NEXUM AI</h3>
    <p>Поиск, код, анализ, планирование — всё в одном</p>
    <div class="suggestion-grid">
      <button class="suggestion" onclick="useSuggestion(this)"><span class="sug-icon">🔍</span>Новости об ИИ сегодня</button>
      <button class="suggestion" onclick="useSuggestion(this)"><span class="sug-icon">💻</span>Напиши Python скрипт</button>
      <button class="suggestion" onclick="useSuggestion(this)"><span class="sug-icon">📋</span>Составь план на неделю</button>
      <button class="suggestion" onclick="useSuggestion(this)"><span class="sug-icon">🧠</span>Что ты обо мне знаешь?</button>
    </div>
  </div>
  <div id="chatArea" style="display:none"></div>
</div>

<!-- Input area -->
<div class="input-area">
  <div class="input-box">
    <div id="imgPreviewWrap"></div>
    <div class="input-row">
      <textarea id="msgInput" placeholder="Напиши сообщение..." rows="1"
        onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
      <button class="stop-btn" id="stopBtn" style="display:none" onclick="stopGeneration()">
        <svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2"/></svg>
      </button>
    </div>
    <div class="input-actions">
      <button class="action-chip" onclick="triggerFileUpload()" title="Загрузить изображение">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
        Фото
      </button>
      <button class="action-chip" id="searchChip" onclick="toggleSearch()">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        Поиск
      </button>
      <span class="action-spacer"></span>
      <span style="font-size:.7rem;color:var(--text3)" id="charCount"></span>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
<div class="toast" id="toast"></div>

<script>
const uid = new URLSearchParams(location.search).get('uid') || '';
const API = '/api';

// ─── State ───────────────────────────────────────
let chats = [];          // [{id, title, messages:[]}]
let activeChatId = null;
let currentMode = 'chat';
let isLoading = false;
let abortController = null;
let pendingImages = [];   // base64 images
let searchEnabled = false;

// ─── Init ────────────────────────────────────────
(function init(){
  try { chats = JSON.parse(localStorage.getItem('nx_chats_v3') || '[]'); } catch { chats = []; }
  if (chats.length === 0) newChat(false);
  else { activeChatId = chats[chats.length-1].id; renderSidebar(); renderActiveChat(); }
  document.getElementById('msgInput').focus();
})();

// ─── Chat Management ─────────────────────────────
function newChat(save=true) {
  const id = Date.now().toString();
  const chat = { id, title: 'Новый чат', messages: [] };
  chats.push(chat);
  activeChatId = id;
  if (save) saveChats();
  renderSidebar();
  renderActiveChat();
  closeSidebar();
  document.getElementById('msgInput').focus();
}

function switchChat(id) {
  activeChatId = id;
  renderSidebar();
  renderActiveChat();
  closeSidebar();
}

function deleteChat(id, e) {
  e.stopPropagation();
  chats = chats.filter(c => c.id !== id);
  if (activeChatId === id) {
    if (chats.length === 0) newChat(false);
    else activeChatId = chats[chats.length-1].id;
  }
  saveChats(); renderSidebar(); renderActiveChat();
}

function getActiveChat() { return chats.find(c => c.id === activeChatId); }

function saveChats() {
  try { localStorage.setItem('nx_chats_v3', JSON.stringify(chats.slice(-30))); } catch {}
}

// ─── Render Sidebar ───────────────────────────────
function renderSidebar() {
  const el = document.getElementById('chatsList');
  el.innerHTML = '';
  [...chats].reverse().forEach(c => {
    const div = document.createElement('div');
    div.className = 'chat-item' + (c.id === activeChatId ? ' active' : '');
    div.onclick = () => switchChat(c.id);
    div.innerHTML = `
      <span class="chat-item-icon">💬</span>
      <span class="chat-item-title">${esc(c.title)}</span>
      <button class="chat-item-del" onclick="deleteChat('${c.id}',event)">✕</button>
    `;
    el.appendChild(div);
  });
}

// ─── Render Active Chat ───────────────────────────
function renderActiveChat() {
  const chat = getActiveChat();
  if (!chat) return;
  document.getElementById('chatTitle').textContent = chat.title || 'AI Агент';
  const area = document.getElementById('chatArea');
  area.innerHTML = '';
  if (chat.messages.length === 0) {
    document.getElementById('emptyState').style.display = 'flex';
    area.style.display = 'none';
  } else {
    document.getElementById('emptyState').style.display = 'none';
    area.style.display = 'flex';
    chat.messages.forEach(m => {
      appendBubble(m.role, m.content, m.sources || [], false);
    });
    scrollBottom();
  }
}

// ─── Modes ────────────────────────────────────────
function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tool-chip').forEach(c => c.classList.remove('active'));
  document.getElementById('chip-'+mode).classList.add('active');
  const ph = {
    chat: 'Напиши сообщение...',
    search: 'Что найти в интернете?',
    code: 'Опиши задачу для кода...',
    think: 'Вопрос для глубокого анализа...',
    memory: 'Что запомнить или вспомнить?',
  };
  document.getElementById('msgInput').placeholder = ph[mode] || 'Напиши сообщение...';
  if (mode === 'search') { searchEnabled = true; document.getElementById('searchChip').classList.add('active'); }
}

function toggleSearch() {
  searchEnabled = !searchEnabled;
  document.getElementById('searchChip').classList.toggle('active', searchEnabled);
}

// ─── File Upload ─────────────────────────────────
function triggerFileUpload() { document.getElementById('fileInput').click(); }

function handleFileSelect(e) {
  const file = e.target.files[0];
  if (!file) return;
  if (!file.type.startsWith('image/')) { showToast('Только изображения', 2000, 'error'); return; }
  if (file.size > 10 * 1024 * 1024) { showToast('Файл слишком большой (макс 10MB)', 2000, 'error'); return; }
  const reader = new FileReader();
  reader.onload = (ev) => {
    const b64 = ev.target.result;
    pendingImages.push(b64);
    addImagePreview(b64, pendingImages.length - 1);
  };
  reader.readAsDataURL(file);
  e.target.value = '';
}

function addImagePreview(b64, idx) {
  const wrap = document.getElementById('imgPreviewWrap');
  wrap.classList.add('has-img');
  const thumb = document.createElement('div');
  thumb.className = 'img-thumb';
  thumb.dataset.idx = idx;
  thumb.innerHTML = `
    <img src="${b64}">
    <button class="img-thumb-del" onclick="removeImage(${idx})">✕</button>
  `;
  wrap.appendChild(thumb);
}

function removeImage(idx) {
  pendingImages[idx] = null;
  const wrap = document.getElementById('imgPreviewWrap');
  const thumbs = wrap.querySelectorAll('[data-idx="'+idx+'"]');
  thumbs.forEach(t => t.remove());
  if (pendingImages.filter(Boolean).length === 0) wrap.classList.remove('has-img');
}

// ─── Send ─────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  const imgs = pendingImages.filter(Boolean);
  if ((!text && imgs.length === 0) || isLoading) return;

  input.value = ''; input.style.height = 'auto';
  pendingImages = [];
  const wrap = document.getElementById('imgPreviewWrap');
  wrap.innerHTML = ''; wrap.classList.remove('has-img');
  document.getElementById('charCount').textContent = '';

  const chat = getActiveChat();
  if (!chat) return;

  // Show chat
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('chatArea').style.display = 'flex';

  isLoading = true;
  toggleSendStop(true);

  // Add user message
  const userContent = text + (imgs.length ? ' [изображение]' : '');
  chat.messages.push({ role: 'user', content: userContent });
  appendBubble('user', userContent, [], true);

  // Auto title from first message
  if (chat.messages.length === 1 && text) {
    chat.title = text.slice(0, 40) + (text.length > 40 ? '...' : '');
    document.getElementById('chatTitle').textContent = chat.title;
    renderSidebar();
  }

  saveChats();

  // Thinking indicator
  const thinkId = appendThinking();
  scrollBottom();

  try {
    // Build messages for API
    const useSearch = searchEnabled || currentMode === 'search';
    const history = chat.messages
      .filter(m => !m.content.startsWith('[SYSTEM]:'))
      .slice(-20)
      .map(m => ({ role: m.role, content: m.content }));

    // SSE streaming
    abortController = new AbortController();

    const payload = {
      uid: uid || undefined,
      messages: history,
      mode: currentMode,
      search: useSearch,
      images: imgs.length > 0 ? imgs : undefined,
      stream: true,
    };

    let fullContent = '';
    let sources = [];
    let msgDiv = null;

    // Try streaming first
    try {
      const resp = await fetch(`${API}/chat/stream`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
        signal: abortController.signal,
      });

      if (resp.ok && resp.headers.get('content-type')?.includes('text/event-stream')) {
        removeThinking(thinkId);
        msgDiv = appendStreamingBubble();

        const reader = resp.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop();
          for (const line of lines) {
            if (!line.startsWith('data: ')) continue;
            const data = line.slice(6);
            if (data === '[DONE]') break;
            try {
              const parsed = JSON.parse(data);
              if (parsed.delta) {
                fullContent += parsed.delta;
                msgDiv.innerHTML = renderMD(fullContent);
                scrollBottom();
              }
              if (parsed.sources) sources = parsed.sources;
            } catch {}
          }
        }
        if (msgDiv) msgDiv.classList.remove('streaming');
      } else {
        throw new Error('no-stream');
      }
    } catch (streamErr) {
      if (streamErr.name === 'AbortError') {
        removeThinking(thinkId);
        if (msgDiv) { msgDiv.classList.remove('streaming'); if (!fullContent) msgDiv.innerHTML = '<em style="color:var(--text3)">Остановлено</em>'; }
        isLoading = false; toggleSendStop(false);
        return;
      }
      // Fallback to regular POST
      removeThinking(thinkId);
      const res = await fetch(`${API}/chat`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ ...payload, stream: false }),
        signal: abortController.signal,
      });
      if (!res.ok) throw new Error((await res.json().catch(()=>({}))).error || `HTTP ${res.status}`);
      const data = await res.json();
      fullContent = data.content || data.reply || '(пустой ответ)';
      sources = data.sources || [];
      if (!msgDiv) msgDiv = appendBubble('assistant', fullContent, sources, true);
    }

    // Add sources if any
    if (sources.length && msgDiv) {
      const sEl = document.createElement('div');
      sEl.className = 'msg-sources';
      sEl.innerHTML = `<div class="sources-label">Источники</div><div class="sources-pills">${
        sources.slice(0,5).map((s,i)=>`<a class="source-pill" href="${esc(s.link||'#')}" target="_blank"><span class="source-pill-num">${i+1}</span><span class="source-pill-title">${esc(s.title||s.link||'Link')}</span></a>`).join('')
      }</div>`;
      msgDiv.parentElement?.appendChild(sEl);
    }

    chat.messages.push({ role: 'assistant', content: fullContent, sources });
    saveChats();

  } catch (e) {
    if (e.name === 'AbortError') {
      removeThinking(thinkId);
    } else {
      removeThinking(thinkId);
      appendBubble('assistant', '⚠️ ' + (e.message || 'Ошибка запроса'), [], true);
      showToast(e.message, 3000, 'error');
    }
  }

  isLoading = false;
  toggleSendStop(false);
  scrollBottom();
  document.getElementById('msgInput').focus();
}

function stopGeneration() {
  abortController?.abort();
}

function toggleSendStop(loading) {
  document.getElementById('sendBtn').style.display = loading ? 'none' : 'flex';
  document.getElementById('stopBtn').style.display = loading ? 'flex' : 'none';
}

// ─── Bubble Helpers ───────────────────────────────
function appendBubble(role, content, sources=[], animate=true) {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap ' + role;

  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (!animate) div.style.animation = 'none';

  if (role === 'assistant') div.innerHTML = renderMD(content);
  else div.textContent = content;

  wrap.appendChild(div);

  if (role === 'assistant' && sources.length) {
    const sEl = document.createElement('div');
    sEl.className = 'msg-sources';
    sEl.innerHTML = `<div class="sources-label">Источники</div><div class="sources-pills">${
      sources.slice(0,5).map((s,i)=>`<a class="source-pill" href="${esc(s.link||'#')}" target="_blank"><span class="source-pill-num">${i+1}</span><span class="source-pill-title">${esc(s.title||s.link||'Link')}</span></a>`).join('')
    }</div>`;
    wrap.appendChild(sEl);
  }

  area.appendChild(wrap);
  if (animate) scrollBottom();
  return div;
}

function appendStreamingBubble() {
  const area = document.getElementById('chatArea');
  const wrap = document.createElement('div');
  wrap.className = 'msg-wrap assistant';
  const div = document.createElement('div');
  div.className = 'msg assistant streaming';
  wrap.appendChild(div);
  area.appendChild(wrap);
  scrollBottom();
  return div;
}

function appendThinking() {
  const id = 'think_' + Date.now();
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.id = id;
  div.className = 'thinking-wrap';
  div.innerHTML = `<div class="think-dots"><span></span><span></span><span></span></div>`;
  area.appendChild(div);
  return id;
}
function removeThinking(id) { document.getElementById(id)?.remove(); }

function scrollBottom() { const a=document.getElementById('chatArea'); requestAnimationFrame(()=>{a.scrollTop=a.scrollHeight;}); }

// ─── Markdown ─────────────────────────────────────
function renderMD(text) {
  let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/```(\w+)?\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code class="lang-${l||''}">${c.trim()}</code></pre>`);
  s = s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*\n]+)\*/g,'<em>$1</em>');
  s = s.replace(/^#{3} (.+)$/gm,'<h3>$1</h3>');
  s = s.replace(/^#{2} (.+)$/gm,'<h2>$1</h2>');
  s = s.replace(/^#{1} (.+)$/gm,'<h1>$1</h1>');
  s = s.replace(/^> (.+)$/gm,'<blockquote>$1</blockquote>');
  s = s.replace(/^[-*] (.+)$/gm,'<li>$1</li>').replace(/(<li>.*<\/li>)/s,'<ul>$1</ul>');
  s = s.replace(/^\d+\. (.+)$/gm,'<li>$1</li>');
  s = s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  s = s.replace(/\n\n+/g,'</p><p>').replace(/\n/g,'<br>');
  return `<p>${s}</p>`.replace(/<p>(<h[123]>|<pre>|<ul>|<blockquote>)/g,'$1').replace(/<p><\/p>/g,'');
}

function esc(s) { return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// ─── Utils ────────────────────────────────────────
function handleKey(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,160)+'px'; const l=el.value.length; document.getElementById('charCount').textContent=l>50?l+'':'' ; }
function useSuggestion(btn) { const t=btn.querySelector('.sug-icon'); const txt=btn.textContent.trim(); document.getElementById('msgInput').value=txt.slice((t?.textContent||'').length).trim(); sendMessage(); }
function clearChat() { const c=getActiveChat(); if(!c)return; if(c.messages.length&&!confirm('Очистить этот чат?'))return; c.messages=[]; c.title='Новый чат'; saveChats(); renderSidebar(); renderActiveChat(); showToast('Чат очищен'); }
function openSidebar() { document.getElementById('sidebar').classList.add('open'); document.getElementById('sidebarOverlay').classList.add('open'); }
function closeSidebar() { document.getElementById('sidebar').classList.remove('open'); document.getElementById('sidebarOverlay').classList.remove('open'); }

function showToast(msg, ms=2200, type='') {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'toast show' + (type ? ' '+type : '');
  setTimeout(()=>t.classList.remove('show'), ms);
}

if (window.Telegram?.WebApp) {
  window.Telegram.WebApp.ready();
  window.Telegram.WebApp.expand();
}
</script>
