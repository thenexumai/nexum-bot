<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI Агент — NEXUM</title>
<link rel="stylesheet" href="/shared/design-system.css">
<style>
  * { box-sizing: border-box; }
  body { display: flex; flex-direction: column; height: 100dvh; overflow: hidden; }
  .app-header { flex-shrink: 0; }

  #chatArea {
    flex: 1; overflow-y: auto; padding: 12px 14px;
    display: flex; flex-direction: column; gap: 10px; scroll-behavior: smooth;
  }
  .msg {
    max-width: 88%; padding: 10px 14px; border-radius: 16px;
    font-size: .88rem; line-height: 1.55; word-break: break-word;
    animation: fadeUp .2s ease;
  }
  @keyframes fadeUp { from{opacity:0;transform:translateY(6px)} to{opacity:1;transform:none} }
  .msg.user { align-self:flex-end; background:var(--accent); color:#fff; border-bottom-right-radius:4px; }
  .msg.assistant { align-self:flex-start; background:var(--surface); border:1px solid var(--border); color:var(--text); border-bottom-left-radius:4px; }
  .msg.thinking { display:flex; gap:4px; align-items:center; }
  .msg.thinking span { width:7px; height:7px; border-radius:50%; background:var(--accent); opacity:.4; animation:dot 1.2s infinite; }
  .msg.thinking span:nth-child(2){animation-delay:.2s} .msg.thinking span:nth-child(3){animation-delay:.4s}
  @keyframes dot{0%,80%,100%{opacity:.2;transform:scale(.8)}40%{opacity:1;transform:scale(1)}}

  .msg.assistant code { background:var(--bg); border:1px solid var(--border); border-radius:4px; padding:1px 5px; font-family:var(--font-mono); font-size:.82rem; }
  .msg.assistant pre { background:var(--bg); border:1px solid var(--border); border-radius:8px; padding:10px 12px; overflow-x:auto; font-family:var(--font-mono); font-size:.78rem; margin:8px 0 2px; }
  .msg.assistant pre code { background:none; border:none; padding:0; }
  .msg.assistant ul,.msg.assistant ol { padding-left:18px; margin:6px 0; }
  .msg.assistant li { margin-bottom:3px; }
  .msg.assistant p { margin:0 0 6px; }
  .msg.assistant p:last-child { margin-bottom:0; }
  .sources { margin-top:8px; padding-top:8px; border-top:1px solid var(--border); font-size:.75rem; color:var(--text3); }
  .sources a { color:var(--accent); text-decoration:none; }

  #toolbar { flex-shrink:0; display:flex; gap:6px; padding:8px 14px 0; overflow-x:auto; scrollbar-width:none; }
  #toolbar::-webkit-scrollbar { display:none; }
  .tool-chip { display:flex; align-items:center; gap:5px; background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:5px 12px; font-size:.75rem; font-weight:600; color:var(--text2); cursor:pointer; white-space:nowrap; transition:all .15s; flex-shrink:0; }
  .tool-chip:hover,.tool-chip.active { border-color:var(--accent); color:var(--accent); background:var(--accent-dim); }

  #emptyState { flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:20px; text-align:center; color:var(--text3); }
  #emptyState .big-icon { font-size:2.4rem; margin-bottom:4px; }
  #emptyState h3 { font-size:1rem; font-weight:700; color:var(--text2); margin:0; }
  #emptyState p { font-size:.82rem; margin:0; max-width:240px; }
  .suggestion-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:16px; width:100%; max-width:320px; }
  .suggestion { background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-sm); padding:10px 12px; font-size:.78rem; color:var(--text2); cursor:pointer; text-align:left; transition:all .15s; line-height:1.4; }
  .suggestion:hover { border-color:var(--accent); color:var(--text); }
  .suggestion .sug-icon { display:block; font-size:1.1rem; margin-bottom:4px; }

  #inputBar { flex-shrink:0; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--bg); border-top:1px solid var(--border); display:flex; gap:8px; align-items:flex-end; }
  #msgInput { flex:1; resize:none; min-height:40px; max-height:120px; padding:10px 12px; font-family:var(--font); font-size:.88rem; background:var(--surface); border:1px solid var(--border); border-radius:20px; color:var(--text); outline:none; overflow-y:auto; line-height:1.4; transition:border-color .15s; }
  #msgInput:focus { border-color:var(--accent); }
  #msgInput::placeholder { color:var(--text3); }
  #sendBtn { width:40px; height:40px; border-radius:50%; background:var(--accent); border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; transition:background .15s,transform .1s; }
  #sendBtn:hover { filter:brightness(1.1); }
  #sendBtn:active { transform:scale(.92); }
  #sendBtn:disabled { background:var(--border); cursor:not-allowed; }
  #sendBtn svg { width:18px; height:18px; fill:#fff; }
  #clearBtn { background:none; border:none; color:var(--text3); font-size:.75rem; cursor:pointer; padding:4px 8px; border-radius:8px; transition:color .15s; }
  #clearBtn:hover { color:var(--text); }
  .toast { position:fixed; bottom:80px; left:50%; transform:translateX(-50%) translateY(10px); background:var(--surface); border:1px solid var(--border); border-radius:20px; padding:8px 18px; font-size:.82rem; color:var(--text); opacity:0; transition:all .2s; pointer-events:none; white-space:nowrap; z-index:999; }
  .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>
<body>

<header class="app-header">
  <div class="header-logo">
    <div class="logo-dot">🤖</div>
    <h1>AI Агент</h1>
  </div>
  <button id="clearBtn" onclick="clearChat()">✕ Очистить</button>
</header>

<div id="toolbar">
  <button class="tool-chip active" id="chip-chat" onclick="setMode('chat')">💬 Чат</button>
  <button class="tool-chip" id="chip-search" onclick="setMode('search')">🔍 Поиск</button>
  <button class="tool-chip" id="chip-code" onclick="setMode('code')">💻 Код</button>
  <button class="tool-chip" id="chip-memory" onclick="setMode('memory')">🧠 Память</button>
</div>

<div id="emptyState">
  <div class="big-icon">✨</div>
  <h3>NEXUM AI Агент</h3>
  <p>Спроси что угодно — поиск, код, задачи, планирование</p>
  <div class="suggestion-grid">
    <button class="suggestion" onclick="useSuggestion(this)"><span class="sug-icon">🔍</span>Последние новости об ИИ</button>
    <button class="suggestion" onclick="useSuggestion(this)"><span class="sug-icon">💻</span>Напиши Python скрипт для парсинга CSV</button>
    <button class="suggestion" onclick="useSuggestion(this)"><span class="sug-icon">📋</span>Составь план задач на неделю</button>
    <button class="suggestion" onclick="useSuggestion(this)"><span class="sug-icon">🧠</span>Что ты обо мне помнишь?</button>
  </div>
</div>

<div id="chatArea" style="display:none"></div>

<div id="inputBar">
  <textarea id="msgInput" placeholder="Напиши сообщение..." rows="1"
    onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
  <button id="sendBtn" onclick="sendMessage()">
    <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
  </button>
</div>

<div class="toast" id="toast"></div>

<script>
const uid = new URLSearchParams(location.search).get('uid') || '';
const API = '/api';
let messages = [];
let currentMode = 'chat';
let isLoading = false;

const SYSTEM_PROMPTS = {
  chat:   'Ты NEXUM — умный AI ассистент. Отвечай на русском, кратко и по делу. Используй markdown для форматирования кода.',
  search: 'Ты NEXUM поисковый агент. Используй инструмент deep_search для актуальной информации. Структурируй ответ с источниками.',
  code:   'Ты NEXUM программист. Пиши чистый, документированный код. Используй markdown code blocks с указанием языка.',
  memory: 'Ты NEXUM агент памяти. Помогай управлять личными данными, фактами. Используй инструменты add_memory и recall_memory.',
};

// Init — restore history
(function(){
  try {
    const saved = localStorage.getItem('nexum_chat_v2');
    if (saved) {
      messages = JSON.parse(saved);
      messages.forEach(m => appendBubble(m.role, m.content));
      if (messages.length) showChat();
    }
  } catch { messages = []; }
  document.getElementById('msgInput').focus();
})();

function setMode(mode) {
  currentMode = mode;
  document.querySelectorAll('.tool-chip').forEach(c => c.classList.remove('active'));
  document.getElementById('chip-' + mode).classList.add('active');
  const ph = {chat:'Напиши сообщение...',search:'Что найти в интернете?',code:'Опиши задачу для кода...',memory:'Что запомнить или вспомнить?'};
  document.getElementById('msgInput').placeholder = ph[mode];
}

function handleKey(e) { if (e.key==='Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height='auto'; el.style.height=Math.min(el.scrollHeight,120)+'px'; }

async function sendMessage() {
  const input = document.getElementById('msgInput');
  const text = input.value.trim();
  if (!text || isLoading) return;
  input.value = ''; input.style.height = 'auto';
  showChat(); isLoading = true;
  document.getElementById('sendBtn').disabled = true;

  messages.push({ role:'user', content:text });
  appendBubble('user', text);
  saveHistory();

  const thinkId = 'think_' + Date.now();
  appendThinking(thinkId);
  scrollBottom();

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ uid, mode: currentMode, messages: buildMessages() }),
    });
    removeThinking(thinkId);
    if (!res.ok) { const e = await res.json().catch(()=>({})); throw new Error(e.error || `HTTP ${res.status}`); }
    const data = await res.json();
    const reply = data.content || data.reply || data.message || '(пустой ответ)';
    const sources = data.sources || [];
    messages.push({ role:'assistant', content:reply });
    appendBubble('assistant', reply, sources);
    saveHistory();
  } catch(e) {
    removeThinking(thinkId);
    appendBubble('assistant', '⚠️ ' + (e.message || 'Не удалось получить ответ'));
    showToast('Ошибка: ' + e.message, 3000);
  }

  isLoading = false;
  document.getElementById('sendBtn').disabled = false;
  scrollBottom();
  document.getElementById('msgInput').focus();
}

function buildMessages() {
  return [
    { role:'user', content:`[SYSTEM]: ${SYSTEM_PROMPTS[currentMode]}` },
    ...messages.slice(-20)
  ];
}

function showChat() {
  document.getElementById('emptyState').style.display = 'none';
  document.getElementById('chatArea').style.display = 'flex';
}

function appendBubble(role, content, sources=[]) {
  const area = document.getElementById('chatArea');
  const div = document.createElement('div');
  div.className = 'msg ' + role;
  if (role === 'assistant') {
    div.innerHTML = renderMD(content);
    if (sources.length) {
      const s = document.createElement('div');
      s.className = 'sources';
      s.innerHTML = '🔗 ' + sources.slice(0,4).map((r,i)=>`<a href="${esc(r.link)}" target="_blank">[${i+1}] ${esc(r.title)}</a>`).join(' · ');
      div.appendChild(s);
    }
  } else {
    div.textContent = content;
  }
  area.appendChild(div);
  scrollBottom();
}

function appendThinking(id) {
  const div = document.createElement('div');
  div.className = 'msg assistant thinking'; div.id = id;
  div.innerHTML = '<span></span><span></span><span></span>';
  document.getElementById('chatArea').appendChild(div);
}

function removeThinking(id) { document.getElementById(id)?.remove(); }
function scrollBottom() { const a=document.getElementById('chatArea'); requestAnimationFrame(()=>{a.scrollTop=a.scrollHeight;}); }

function renderMD(text) {
  let s = text.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  s = s.replace(/```(\w*)\n?([\s\S]*?)```/g,(_,l,c)=>`<pre><code>${c.trim()}</code></pre>`);
  s = s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s = s.replace(/\*([^*]+)\*/g,'<em>$1</em>');
  s = s.replace(/^#{1,3} (.+)$/gm,'<strong style="display:block;margin-top:8px">$1</strong>');
  s = s.replace(/^[\-\*] (.+)$/gm,'<li>$1</li>');
  s = s.replace(/\n\n/g,'</p><p>').replace(/\n/g,'<br>');
  return `<p>${s}</p>`.replace(/<p><\/p>/g,'');
}

function esc(s){ return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function useSuggestion(btn) { document.getElementById('msgInput').value = btn.textContent.trim().slice(2).trim(); sendMessage(); }
function saveHistory() { try{ localStorage.setItem('nexum_chat_v2', JSON.stringify(messages.slice(-50))); }catch{} }
function clearChat() {
  if (messages.length && !confirm('Очистить историю чата?')) return;
  messages = [];
  document.getElementById('chatArea').innerHTML = '';
  document.getElementById('chatArea').style.display = 'none';
  document.getElementById('emptyState').style.display = 'flex';
  localStorage.removeItem('nexum_chat_v2');
  showToast('История очищена');
}
function showToast(msg,ms=2000) { const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),ms); }
</script>
</body>
</html>
