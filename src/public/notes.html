<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Notes — NEXUM</title>
<link rel="stylesheet" href="/shared/design-system.css">
<style>
  .notes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .note-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px;
    cursor: pointer; transition: border-color .15s, transform .1s;
    position: relative; min-height: 120px;
  }
  .note-card:hover { border-color: var(--border2); transform: translateY(-1px); }
  .note-card.pinned { border-color: var(--accent); }
  .note-card-title { font-weight: 700; font-size: .9rem; margin-bottom: 6px; }
  .note-card-body  { font-size: .78rem; color: var(--text2); line-height: 1.5; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; }
  .note-card-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
  .note-card-date   { font-size: .7rem; color: var(--text3); }
  .pin-icon { position: absolute; top: 10px; right: 10px; font-size: .8rem; opacity: .7; }
  .editor-area { min-height: 200px; font-size: .95rem; line-height: 1.7; }
  .search-bar { margin-bottom: 12px; }
</style>
</head>
<body>
<header class="app-header">
  <div class="header-logo">
    <div class="logo-dot">📝</div>
    <h1>Notes</h1>
  </div>
  <span class="badge badge-accent" id="noteCount">0</span>
</header>

<div class="page">
  <div class="search-bar">
    <input class="input" id="searchInput" type="search" placeholder="Search notes..." oninput="onSearch()">
  </div>
  <div class="notes-grid" id="noteGrid"></div>
</div>

<button class="fab" onclick="openNew()">+</button>

<!-- Note Editor Modal -->
<div class="modal-overlay" id="modal" onclick="closeIfBg(event)">
  <div class="modal" style="border-radius:var(--radius-lg) var(--radius-lg) 0 0">
    <div class="modal-handle"></div>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
      <h2 id="modalTitle">New Note</h2>
      <div style="display:flex;gap:8px">
        <button class="btn btn-ghost btn-icon" id="pinBtn" onclick="togglePin()" title="Pin">📌</button>
        <button class="btn btn-danger btn-icon" id="deleteBtn" onclick="deleteNote()" title="Delete" style="display:none">🗑</button>
      </div>
    </div>
    <div class="form-group">
      <input class="input" id="inTitle" type="text" placeholder="Title">
    </div>
    <div class="form-group">
      <textarea class="input editor-area" id="inContent" placeholder="Start writing..."></textarea>
    </div>
    <div class="form-group">
      <input class="input" id="inTags" type="text" placeholder="Tags: work, personal, ideas">
    </div>
    <button class="btn btn-primary" style="width:100%" onclick="saveNote()">Save Note</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const uid = new URLSearchParams(location.search).get('uid') || 0;
const API = '/api';
let notes = [];
let editId = null;
let isPinned = false;
let searchQ = '';

async function load() {
  try {
    notes = await fetch(`${API}/notes?uid=${uid}`).then(r=>r.json());
    render();
  } catch(e) {
    document.getElementById('noteGrid').innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">❌</div><h3>${e.message}</h3></div>`;
  }
}

function render() {
  const q = searchQ.toLowerCase();
  let filtered = q
    ? notes.filter(n => n.title?.toLowerCase().includes(q) || n.content?.toLowerCase().includes(q))
    : notes;

  // Pinned first
  filtered.sort((a,b) => (b.pinned||0)-(a.pinned||0));

  document.getElementById('noteCount').textContent = filtered.length;
  const el = document.getElementById('noteGrid');

  if (!filtered.length) {
    el.innerHTML = `<div class="empty" style="grid-column:1/-1"><div class="empty-icon">📝</div><h3>No notes yet</h3><p>Tap + to create your first note</p></div>`;
    return;
  }

  el.innerHTML = filtered.map(n => `
    <div class="note-card ${n.pinned?'pinned':''}" onclick="openEdit(${n.id})">
      ${n.pinned ? '<div class="pin-icon">📌</div>' : ''}
      <div class="note-card-title">${esc(n.title||'Untitled')}</div>
      <div class="note-card-body">${esc(n.content||'')}</div>
      <div class="note-card-footer">
        <span class="note-card-date">${fmtDate(n.created_at)}</span>
        ${n.tags ? `<span class="badge badge-accent" style="font-size:.65rem">${esc(n.tags.split(',')[0].trim())}</span>` : ''}
      </div>
    </div>`).join('');
}

function esc(s){ return (s||'').replace(/</g,'&lt;'); }
function fmtDate(s){ return s?new Date(s).toLocaleDateString('en-US',{month:'short',day:'numeric'}):''; }
function onSearch(){ searchQ=document.getElementById('searchInput').value; render(); }

function openNew(){
  editId=null; isPinned=false;
  document.getElementById('modalTitle').textContent='New Note';
  document.getElementById('inTitle').value='';
  document.getElementById('inContent').value='';
  document.getElementById('inTags').value='';
  document.getElementById('deleteBtn').style.display='none';
  document.getElementById('pinBtn').textContent='📌';
  document.getElementById('modal').classList.add('open');
  setTimeout(()=>document.getElementById('inTitle').focus(),300);
}

function openEdit(id){
  const n=notes.find(x=>x.id===id);
  if(!n) return;
  editId=id; isPinned=!!n.pinned;
  document.getElementById('modalTitle').textContent='Edit Note';
  document.getElementById('inTitle').value=n.title||'';
  document.getElementById('inContent').value=n.content||'';
  document.getElementById('inTags').value=n.tags||'';
  document.getElementById('deleteBtn').style.display='flex';
  document.getElementById('pinBtn').textContent=isPinned?'📍':'📌';
  document.getElementById('modal').classList.add('open');
}

function togglePin(){ isPinned=!isPinned; document.getElementById('pinBtn').textContent=isPinned?'📍':'📌'; }
function closeModal(){ document.getElementById('modal').classList.remove('open'); }
function closeIfBg(e){ if(e.target.id==='modal') closeModal(); }

async function saveNote(){
  const title=document.getElementById('inTitle').value.trim();
  const content=document.getElementById('inContent').value.trim();
  if(!title&&!content) return showToast('Write something first');
  const body={uid,title:title||'Untitled',content,tags:document.getElementById('inTags').value,pinned:isPinned?1:0};
  if(editId){
    await fetch(`${API}/notes/${editId}`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
    const n=notes.find(x=>x.id===editId);
    if(n) Object.assign(n,body);
  } else {
    const res=await fetch(`${API}/notes`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
    notes.unshift(res);
  }
  closeModal(); render(); showToast('✅ Saved!');
}

async function deleteNote(){
  if(!editId) return;
  await fetch(`${API}/notes/${editId}`,{method:'DELETE'});
  notes=notes.filter(n=>n.id!==editId);
  closeModal(); render(); showToast('Deleted');
}

function showToast(msg,ms=2000){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),ms);
}

load();
</script>
</body>
</html>
