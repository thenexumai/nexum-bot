<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes — NEXUM</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0a0a0a;--surface:#111;--surface2:#1a1a1a;--border:#222;
  --text:#f0f0f0;--muted:#888;--accent:#6366f1;--radius:14px;
  --font:-apple-system,BlinkMacSystemFont,'SF Pro Display',system-ui,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);padding:20px 16px;max-width:480px;margin:0 auto}
h2{font-size:22px;font-weight:700;margin-bottom:4px}
.subtitle{color:var(--muted);font-size:14px;margin-bottom:20px}
.new-note{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:16px}
.new-note input{width:100%;background:transparent;border:none;color:var(--text);font-size:15px;font-weight:600;margin-bottom:8px;font-family:inherit}
.new-note input:focus{outline:none}
.new-note input::placeholder{color:var(--muted)}
.new-note textarea{width:100%;background:transparent;border:none;color:var(--text);font-size:14px;resize:none;min-height:80px;line-height:1.5;font-family:inherit}
.new-note textarea:focus{outline:none}
.new-note textarea::placeholder{color:var(--muted)}
.new-note .actions{display:flex;justify-content:flex-end;margin-top:8px}
.btn{background:var(--accent);color:#fff;border:none;border-radius:8px;padding:8px 18px;font-size:13px;font-weight:600;cursor:pointer}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.note{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px;cursor:pointer;position:relative}
.note.pinned{border-color:var(--accent)}
.note-title{font-size:13px;font-weight:600;margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.note-body{font-size:12px;color:var(--muted);line-height:1.4;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.note-date{font-size:11px;color:var(--muted);margin-top:8px}
.note-actions{position:absolute;top:8px;right:8px;display:flex;gap:4px;opacity:0}
.note:hover .note-actions{opacity:1}
.icon-btn{background:var(--surface2);border:none;border-radius:6px;color:var(--muted);font-size:13px;padding:3px 6px;cursor:pointer}
.icon-btn:hover{color:var(--text)}
.empty{color:var(--muted);text-align:center;padding:32px 0;font-size:14px;grid-column:span 2}
</style>
</head>
<body>
<h2>📝 Notes</h2>
<p class="subtitle">Capture ideas fast</p>
<div class="new-note">
  <input id="noteTitle" placeholder="Title (optional)">
  <textarea id="noteBody" placeholder="Write a note..."></textarea>
  <div class="actions"><button class="btn" onclick="addNote()">Save</button></div>
</div>
<div class="grid" id="grid"><div class="empty">No notes yet</div></div>
<script>
const uid = new URLSearchParams(location.search).get('uid') || (window.Telegram?.WebApp?.initDataUnsafe?.user?.id) || 0;
let notes = [];

async function load() {
  if (!uid) return;
  const r = await fetch('/api/notes?uid=' + uid);
  notes = await r.json();
  render();
}

function render() {
  const el = document.getElementById('grid');
  if (!notes.length) { el.innerHTML = '<div class="empty">No notes yet</div>'; return; }
  el.innerHTML = notes.map(n => `
    <div class="note ${n.pinned ? 'pinned' : ''}">
      <div class="note-actions">
        <button class="icon-btn" onclick="pin(${n.id},${n.pinned})" title="Pin">${n.pinned ? '★' : '☆'}</button>
        <button class="icon-btn" onclick="del(${n.id})" title="Delete" style="color:#ef4444">×</button>
      </div>
      ${n.title ? '<div class="note-title">'+n.title+'</div>' : ''}
      <div class="note-body">${n.content}</div>
      <div class="note-date">${n.updated_at?.slice(0,10)}</div>
    </div>
  `).join('');
}

async function addNote() {
  const title = document.getElementById('noteTitle').value.trim();
  const content = document.getElementById('noteBody').value.trim();
  if (!content) return;
  await fetch('/api/notes', {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ uid: parseInt(uid), title, content })
  });
  document.getElementById('noteTitle').value = '';
  document.getElementById('noteBody').value = '';
  load();
}

async function pin(id, current) {
  await fetch('/api/notes/' + id, {
    method:'PATCH', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ pinned: !current })
  });
  load();
}

async function del(id) {
  await fetch('/api/notes/' + id, { method:'DELETE' });
  load();
}

load();
</script>
</body>
</html>
