# NOTE: Railway uses Dockerfile, not nixpacks.toml
# This file is for local/reference use only

[phases.setup]
nixPkgs = ["nodejs-20_x", "python3", "gcc", "g++", "make", "libsqlite3-dev"]

[phases.install]
cmds = ["npm install --build-from-source"]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "npm start"
