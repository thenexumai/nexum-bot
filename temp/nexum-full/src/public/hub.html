<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEXUM</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --bg:#000;--bg2:#0a0a0a;--bg3:#1c1c1e;--bg4:#2c2c2e;--bg5:#3a3a3c;
  --fg:#fff;--fg2:rgba(255,255,255,0.6);--fg3:rgba(255,255,255,0.3);--fg4:rgba(255,255,255,0.12);
  --sep:rgba(255,255,255,0.08);--r:16px;--r2:12px;
  --blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--red:#ff453a;--purple:#bf5af2;--teal:#5ac8fa;
  --font:-apple-system,"SF Pro Display","SF Pro Text",system-ui,sans-serif;
}
html,body{height:100%;background:var(--bg);color:var(--fg);font-family:var(--font);-webkit-font-smoothing:antialiased;overflow-x:hidden}
::-webkit-scrollbar{display:none}

/* Header */
.header{padding:20px 20px 0;display:flex;justify-content:space-between;align-items:flex-start}
.wordmark{font-size:28px;font-weight:700;letter-spacing:-1px}
.time-chip{font-size:13px;color:var(--fg2);background:var(--bg3);padding:5px 10px;border-radius:20px;letter-spacing:0.2px}
.greeting{padding:6px 20px 24px;font-size:15px;color:var(--fg2)}

/* Section label */
.sec{font-size:11px;font-weight:600;letter-spacing:0.08em;text-transform:uppercase;color:var(--fg3);padding:0 20px 12px}

/* App grid */
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:0 20px 28px}
.card{background:var(--bg3);border-radius:var(--r);padding:20px 18px 18px;cursor:pointer;position:relative;overflow:hidden;min-height:130px;display:flex;flex-direction:column;justify-content:space-between;transition:transform 0.15s ease,opacity 0.15s ease;will-change:transform}
.card:active{transform:scale(0.96);opacity:0.85}
.card-glow{position:absolute;top:-40px;right:-30px;width:120px;height:120px;border-radius:50%;opacity:0.2;filter:blur(30px);pointer-events:none}
.card-icon{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;margin-bottom:auto}
.card-icon svg{width:22px;height:22px;fill:currentColor}
.card-title{font-size:16px;font-weight:600;letter-spacing:-0.3px;margin-bottom:2px}
.card-sub{font-size:12px;color:var(--fg2);line-height:1.3}

/* Quick list */
.list{margin:0 20px 28px;background:var(--bg3);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;padding:14px 16px;border-bottom:0.5px solid var(--sep);cursor:pointer;transition:background 0.1s;gap:12px}
.row:last-child{border:none}
.row:active{background:var(--bg4)}
.row-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.row-icon svg{width:17px;height:17px;fill:currentColor}
.row-body{flex:1;min-width:0}
.row-title{font-size:14px;font-weight:500;color:var(--fg)}
.row-sub{font-size:12px;color:var(--fg2);margin-top:1px}
.row-arr{color:var(--fg3);font-size:18px;flex-shrink:0}

/* Lang bar */
.lang-bar{display:flex;gap:8px;padding:0 20px 28px;overflow-x:auto;scrollbar-width:none}
.lang-btn{padding:7px 14px;border-radius:20px;border:none;font-family:var(--font);font-size:13px;font-weight:500;cursor:pointer;background:var(--bg3);color:var(--fg2);white-space:nowrap;transition:all 0.15s;flex-shrink:0}
.lang-btn.act{background:var(--fg);color:var(--bg)}
.pb{height:env(safe-area-inset-bottom,24px)}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
.grid,.list,.lang-bar{animation:fadeUp 0.35s ease both}
.grid{animation-delay:0.05s}.list{animation-delay:0.12s}.lang-bar{animation-delay:0.18s}
</style>
</head>
<body>
<div class="header">
  <div class="wordmark">NEXUM</div>
  <div class="time-chip" id="time-chip">—</div>
</div>
<div class="greeting" id="greeting">Hello</div>

<div class="lang-bar" id="lang-bar"></div>

<div class="sec" id="sec-apps">APPS</div>
<div class="grid">
  <div class="card" onclick="go('/finance')">
    <div class="card-glow" style="background:var(--green)"></div>
    <div class="card-icon" style="background:rgba(48,209,88,.15);color:var(--green)">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 14.93V18h-2v-1.07C9.01 16.45 8 15.31 8 14h2c0 1.1.9 1 2 1s2-.9 2-2c0-1.1-.9-2-2-2-2.21 0-4-1.79-4-4 0-1.73 1.05-3.21 2.57-3.88L11 3h2l.01.12C14.95 3.79 16 5.27 16 7h-2c0-1.1-.9-2-2-2s-2 .9-2 2 .9 2 2 2c2.21 0 4 1.79 4 4 0 1.73-1.05 3.21-2.57 3.88L13 17z"/></svg>
    </div>
    <div>
      <div class="card-title" id="t-finance">Finance</div>
      <div class="card-sub" id="t-finance-sub">Income & expenses</div>
    </div>
  </div>
  <div class="card" onclick="go('/notes')">
    <div class="card-glow" style="background:var(--blue)"></div>
    <div class="card-icon" style="background:rgba(10,132,255,.15);color:var(--blue)">
      <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
    </div>
    <div>
      <div class="card-title" id="t-notes">Notes</div>
      <div class="card-sub" id="t-notes-sub">Ideas & memos</div>
    </div>
  </div>
  <div class="card" onclick="go('/tasks')">
    <div class="card-glow" style="background:var(--orange)"></div>
    <div class="card-icon" style="background:rgba(255,159,10,.15);color:var(--orange)">
      <svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
    </div>
    <div>
      <div class="card-title" id="t-tasks">Tasks</div>
      <div class="card-sub" id="t-tasks-sub">Projects & to-dos</div>
    </div>
  </div>
  <div class="card" onclick="go('/habits')">
    <div class="card-glow" style="background:var(--purple)"></div>
    <div class="card-icon" style="background:rgba(191,90,242,.15);color:var(--purple)">
      <svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 100 20A10 10 0 0012 2zm0 18a8 8 0 110-16 8 8 0 010 16zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67V7z"/></svg>
    </div>
    <div>
      <div class="card-title" id="t-habits">Habits</div>
      <div class="card-sub" id="t-habits-sub">Streaks & progress</div>
    </div>
  </div>
</div>

<div class="sec" id="sec-quick">QUICK ACTIONS</div>
<div class="list">
  <div class="row" onclick="go('/notes?new=1')">
    <div class="row-icon" style="background:rgba(10,132,255,.12);color:var(--blue)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
    </div>
    <div class="row-body">
      <div class="row-title" id="qa-note">New Note</div>
      <div class="row-sub" id="qa-note-sub">Capture an idea</div>
    </div>
    <div class="row-arr">›</div>
  </div>
  <div class="row" onclick="go('/tasks?new=1')">
    <div class="row-icon" style="background:rgba(255,159,10,.12);color:var(--orange)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
    </div>
    <div class="row-body">
      <div class="row-title" id="qa-task">New Task</div>
      <div class="row-sub" id="qa-task-sub">Add to list</div>
    </div>
    <div class="row-arr">›</div>
  </div>
  <div class="row" onclick="go('/finance?new=1')">
    <div class="row-icon" style="background:rgba(48,209,88,.12);color:var(--green)">
      <svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10h-4v4h-2v-4H7v-2h4V7h2v4h4v2z"/></svg>
    </div>
    <div class="row-body">
      <div class="row-title" id="qa-expense">Add Expense</div>
      <div class="row-sub" id="qa-expense-sub">Record a transaction</div>
    </div>
    <div class="row-arr">›</div>
  </div>
</div>
<div class="pb"></div>

<script>
const tg = window.Telegram?.WebApp;
if (tg) { tg.ready(); tg.expand(); }

const BASE_URL = window.location.origin;
function go(path) {
  const sep = path.includes('?') ? '&' : '?';
  const initData = tg?.initData ? sep + 'initData=' + encodeURIComponent(tg.initData) : '';
  window.location.href = BASE_URL + path + initData;
}

// Time
function updateTime() {
  const now = new Date();
  const h = now.getHours().toString().padStart(2,'0');
  const m = now.getMinutes().toString().padStart(2,'0');
  document.getElementById('time-chip').textContent = h + ':' + m;
}
updateTime(); setInterval(updateTime, 30000);

// i18n
const T = {
  ru:{apps:'ПРИЛОЖЕНИЯ',quick:'БЫСТРО',finance:'Финансы',finSub:'Доходы и расходы',notes:'Заметки',notesSub:'Идеи и записи',tasks:'Задачи',tasksSub:'Проекты и дела',habits:'Привычки',habitsSub:'Серии и прогресс',newNote:'Новая заметка',newNoteSub:'Записать идею',newTask:'Новая задача',newTaskSub:'Добавить в список',newExp:'Расход',newExpSub:'Записать транзакцию',hi:'Привет'},
  en:{apps:'APPS',quick:'QUICK ACTIONS',finance:'Finance',finSub:'Income & expenses',notes:'Notes',notesSub:'Ideas & memos',tasks:'Tasks',tasksSub:'Projects & to-dos',habits:'Habits',habitsSub:'Streaks & progress',newNote:'New Note',newNoteSub:'Capture an idea',newTask:'New Task',newTaskSub:'Add to list',newExp:'Add Expense',newExpSub:'Record a transaction',hi:'Hello'},
  uz:{apps:'ILOVALAR',quick:'TEZKOR',finance:'Moliya',finSub:'Daromad va xarajat',notes:'Eslatmalar',notesSub:'G\'oyalar',tasks:'Vazifalar',tasksSub:'Loyihalar',habits:'Odatlar',habitsSub:'Seriyalar',newNote:'Yangi eslatma',newNoteSub:'G\'oya yoz',newTask:'Yangi vazifa',newTaskSub:'Ro\'yxatga qo\'sh',newExp:'Xarajat',newExpSub:'Tranzaksiya yoz',hi:'Salom'},
  de:{apps:'APPS',quick:'AKTIONEN',finance:'Finanzen',finSub:'Einnahmen & Ausgaben',notes:'Notizen',notesSub:'Ideen',tasks:'Aufgaben',tasksSub:'Projekte',habits:'Gewohnheiten',habitsSub:'Serien',newNote:'Neue Notiz',newNoteSub:'Idee festhalten',newTask:'Neue Aufgabe',newTaskSub:'Hinzufügen',newExp:'Ausgabe',newExpSub:'Transaktion',hi:'Hallo'},
  zh:{apps:'应用',quick:'快捷',finance:'财务',finSub:'收支记录',notes:'笔记',notesSub:'想法',tasks:'任务',tasksSub:'项目',habits:'习惯',habitsSub:'连续',newNote:'新建笔记',newNoteSub:'记录想法',newTask:'新建任务',newTaskSub:'添加',newExp:'记录支出',newExpSub:'添加交易',hi:'你好'},
  ar:{apps:'التطبيقات',quick:'إجراءات',finance:'المالية',finSub:'الدخل والمصروفات',notes:'الملاحظات',notesSub:'الأفكار',tasks:'المهام',tasksSub:'المشاريع',habits:'العادات',habitsSub:'السلاسل',newNote:'ملاحظة جديدة',newNoteSub:'التقاط فكرة',newTask:'مهمة جديدة',newTaskSub:'أضف للقائمة',newExp:'مصروف',newExpSub:'تسجيل معاملة',hi:'مرحبا'},
};
const LANGS = {ru:'Русский',en:'English',uz:"O'zbek",de:'Deutsch',zh:'中文',ar:'العربية'};
let lang = localStorage.getItem('nx-lang') || (navigator.language.startsWith('ru') ? 'ru' : navigator.language.startsWith('uz') ? 'uz' : navigator.language.startsWith('de') ? 'de' : navigator.language.startsWith('zh') ? 'zh' : navigator.language.startsWith('ar') ? 'ar' : 'en');

function applyLang() {
  const L = T[lang] || T.en;
  const user = tg?.initDataUnsafe?.user;
  const name = user?.first_name || '';
  document.getElementById('greeting').textContent = L.hi + (name ? ', ' + name : '') + '.';
  document.getElementById('sec-apps').textContent = L.apps;
  document.getElementById('sec-quick').textContent = L.quick;
  document.getElementById('t-finance').textContent = L.finance;
  document.getElementById('t-finance-sub').textContent = L.finSub;
  document.getElementById('t-notes').textContent = L.notes;
  document.getElementById('t-notes-sub').textContent = L.notesSub;
  document.getElementById('t-tasks').textContent = L.tasks;
  document.getElementById('t-tasks-sub').textContent = L.tasksSub;
  document.getElementById('t-habits').textContent = L.habits;
  document.getElementById('t-habits-sub').textContent = L.habitsSub;
  document.getElementById('qa-note').textContent = L.newNote;
  document.getElementById('qa-note-sub').textContent = L.newNoteSub;
  document.getElementById('qa-task').textContent = L.newTask;
  document.getElementById('qa-task-sub').textContent = L.newTaskSub;
  document.getElementById('qa-expense').textContent = L.newExp;
  document.getElementById('qa-expense-sub').textContent = L.newExpSub;
  renderLangs();
}
function renderLangs() {
  document.getElementById('lang-bar').innerHTML = Object.entries(LANGS).map(([k,v]) =>
    `<button class="lang-btn${k===lang?' act':''}" onclick="setLang('${k}')">${v}</button>`).join('');
}
function setLang(l) { lang = l; localStorage.setItem('nx-lang', l); applyLang(); }
applyLang();
</script>
</body>
</html>
